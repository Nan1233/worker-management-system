name: Phase 2 consolidated isolated verification

# One-time run when this workflow is introduced or edited on the refactor branch.
# Optional manual rerun at an explicitly selected SHA. This does not deploy,
# connect to KTC databases, alter production files, or execute remote E2E.
on:
  push:
    branches:
      - refactor/ktc-local-cleanup
    paths:
      - .github/workflows/phase2-consolidated-safe.yml
      - frontend/tests/permission-cache-invalidation-race.test.cjs
      - frontend/src/security/permissions.ts
      - frontend/src/pages/admin/Permissions.css
      - frontend/tests/admin-permission-responsive.contract.test.cjs
      - backend/tests/phase2-batch3-historical-kpi-parity.test.js
      - backend/tests/approved-edit-preserves-machine-data.test.js
      - backend/tests/approved-edit-concurrency.test.js
      - backend/controllers/productionTempManagementController.js
      - backend/models/productionTempApprovalModel.js
      - backend/domain/operationNormalization.js
      - backend/controllers/productionTempControllerUtils.js
      - backend/services/productionTempReportPayloadService.js
      - backend/models/productionTempRejectionBuilders.js
      - backend/tests/rejection-builders-batch-refactor.test.js
      - backend/tests/review-locking-and-cas-regression.test.js
      - backend/tests/review-rejection-row-lock.contract.test.js
      - backend/tests/business-matrix-nine-process-four-shifts.test.js
      - backend/tests/integration/business-process-scope.http.test.js
      - backend/services/processMachinePolicy.js
      - backend/utils/reportValidation.js
      - backend/services/processAuthorizationService.js
      - backend/services/productionMachineReportGrouping.js
      - backend/controllers/managerReportListUtils.js
      - backend/tests/manager-report-list-utils.test.js
      - backend/tests/approved-machine-copy-real-mapping-integration.test.js
      - backend/tests/shared-machine-accounting-flow.test.js
      - desktop/tests/phase2-batch4-xlsx-isolated-roundtrip.test.cjs
      - desktop/tests/release-signing.test.cjs
      - desktop/tests/setup-auto-update.test.cjs
      - desktop/tests/portable-upgrade-safety.test.cjs
      - desktop/tests/deployment-profile.test.cjs
      - desktop/scripts/deviceSmoke.cjs
      - desktop/scripts/windowsArtifactInventory.cjs
      - desktop/tests/windows-artifact-inventory.test.cjs
      - desktop/tests/workbook1-process-export.test.cjs
      - desktop/electron/excelDbSync.cjs
      - desktop/electron/excelDbSyncValues.cjs
      - desktop/scripts/checkExcelDbSync.cjs
      - desktop/tests/excel-sync-values-refactor.test.cjs
      - desktop/electron/monthlyWorkbookLocal.cjs
      - desktop/electron/desktopLog.cjs
      - desktop/electron/launcher.cjs
      - desktop/electron/preload.cjs
      - desktop/tests/electron-startup-ipc-privacy.test.cjs
      - desktop/electron/securityPolicy.cjs
      - desktop/electron/main.cjs
      - desktop/tests/electron-ipc-sender-guard.test.cjs
      - frontend/tests/e2e/phase3-public-security.spec.ts
      - frontend/playwright.phase3.config.ts
      - frontend/src/pages/manager/**
      - frontend/src/pages/worker/ProcessPage.tsx
      - frontend/src/pages/worker/processSubmitBatchSlices.ts
      - frontend/tests/process-submit-batch-slices.test.cjs
      - frontend/src/pages/worker/processFormValidationRules.ts
      - frontend/tests/process-form-validation-rules.test.cjs
      - frontend/src/pages/worker/processDeductionLogic.ts
      - frontend/src/pages/worker/processFormResetGuard.ts
      - frontend/tests/process-page-reset-deduction-refactor.test.cjs
      - frontend/src/pages/worker/useProcessMasterData.ts
      - frontend/tests/approved-edit-hydration-gate.contract.test.cjs
      - frontend/tests/approved-reports-presentation.test.cjs
      - frontend/src/pages/worker/WorkerReportEditV2.tsx
      - frontend/src/pages/worker/components/ProcessQualitySection.tsx
      - frontend/src/pages/admin/MasterData.tsx
      - frontend/src/pages/admin/masterDataConfig.ts
      - frontend/tests/master-data-config.test.cjs
      - frontend/src/layouts/AdminLayout.tsx
      - frontend/tests/e2e/role-navigation.spec.ts
      - frontend/playwright.config.ts
      - frontend/tests/manager-approved-native-navigation.contract.test.cjs
      - frontend/tests/manager-pending-native-table.contract.test.cjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ktc-phase2-safe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend focused regression and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_HOST: ""
      DB_NAME: ""
      DATABASE_URL: ""
      KTC_E2E_DB_NAME: ""
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Backend syntax/source check
        run: npm run check
      - name: Review, submission, idempotency, historical time and contract tests (mocked / pure)
        run: |
          node --test \
            tests/manager-report-list-utils.test.js \
            tests/report-edit-proposal-read-normalization.test.js \
            tests/proposalReviewTransaction.contract.test.js \
            tests/proposalReviewRollback.behavior.test.js \
            tests/production-child-totals-validation.test.js \
            tests/production-daily-hours-parity-refactor.test.js \
            tests/production-submission-queue.test.js \
            tests/review-transaction-failure-order-regression.test.js \
            tests/approved-edit-concurrency.test.js \
            tests/rejection-builders-batch-refactor.test.js \
            tests/review-locking-and-cas-regression.test.js \
            tests/review-rejection-row-lock.contract.test.js \
            tests/business-matrix-nine-process-four-shifts.test.js \
            tests/process-machine-policy.test.js \
            tests/production-calculation-engine.test.js \
            tests/production-machine-report-grouping.test.js \
            tests/report-validation-deduction-minutes.test.js \
            tests/worker-process-access.test.js \
            tests/approved-edit-preserves-machine-data.test.js \
            tests/logical-duplicate-transaction.test.js \
            tests/production-submission-lock.contract.test.js \
            tests/non-product-work-idempotency.contract.test.js \
            tests/historical-standard-resolution.test.js \
            tests/historical-standard-overlap-guard.test.js \
            tests/standard-ambiguity-fail-closed.test.js \
            tests/approved-version-snapshot-determinism-regression.test.js \
            tests/rollback-snapshot-v2.test.js \
            tests/gc-physical-machine-hours.test.js \
            tests/gc-machine-time-accounting.test.js \
            tests/shared-machine-accounting-flow.test.js \
            tests/shared-production-metric-primitives.test.js \
            tests/pending-kpi-machine-lines.test.js \
            tests/approved-machine-copy-real-mapping-integration.test.js \
            tests/phase2-batch3-historical-kpi-parity.test.js

  frontend:
    name: Frontend focused regression, lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused frontend API, Manager, Worker and Admin tests
        run: |
          node --test \
            tests/machine-event-participant-api.contract.test.cjs \
            tests/manager-approved-native-navigation.contract.test.cjs \
            tests/approved-reports-presentation.test.cjs \
            tests/approved-edit-hydration-gate.contract.test.cjs \
            tests/manager-pending-native-table.contract.test.cjs \
            tests/f02-process-form-extracted-hooks.test.cjs \
            tests/process-page-reset-deduction-refactor.test.cjs \
            tests/process-form-validation-rules.test.cjs \
            tests/permission-cache-invalidation-race.test.cjs \
            tests/f02-draft-storage-regression.test.cjs \
            tests/phase5-split-submit-resume.test.cjs \
            tests/process-submit-batch-slices.test.cjs \
            tests/phase5-offline-atomic-batch.test.cjs \
            tests/offline-queue-flush-races.test.cjs \
            tests/offline-any-network.contract.test.cjs \
            tests/worker-single-click-submit.test.cjs \
            tests/master-control-center.test.cjs \
            tests/master-data-config.test.cjs \
            tests/permissions-ui.test.cjs \
            tests/master-tabs-mobile.test.cjs \
            tests/admin-permission-responsive.contract.test.cjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  browser:
    name: Browser public security and responsive smoke (no backend)
    # Playwright 1.56 does not support ubuntu-26.04 (ubuntu-latest in this runner pool).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: ""
      DB_HOST: ""
      VITE_API_URL: http://127.0.0.1:19999/api
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Avoid apt mirror outages in hosted runners; install browser binary only.
      # Ubuntu 24.04 runner already has the standard browser runtime libraries.
      - run: npx playwright install chromium
      - name: Real Chromium browser-only route guard and mobile login
        run: npx playwright test --config=playwright.phase3.config.ts

  desktop:
    name: Desktop synthetic/pure Excel parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      KTC_EXPORT_ROOT: /tmp/ktc-phase2-excel
      KTC_GIA_CONG_SAMPLE_ROOT: /tmp/ktc-phase2-excel-gc
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Electron installer download and lifecycle writers are unnecessary for
      # the selected Node + ExcelJS synthetic fixture tests.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Excel naming, calculation and physical-machine metadata tests
        run: |
          node --test \
            tests/monthly-workbook-naming-parity.test.cjs \
            tests/production-calculation-engine.test.cjs \
            tests/monthly-workbook-physical-events.test.cjs \
            tests/company-excel-shared-machine.test.cjs \
            tests/desktop-web-export-parity.test.cjs \
            tests/phase2-batch4-xlsx-isolated-roundtrip.test.cjs \
            tests/excel-sync-values-refactor.test.cjs \
            tests/workbook1-process-export.test.cjs \
            tests/mai-do-export-parity.test.cjs \
            tests/monthly-workbook-physical-event-metadata.test.cjs \
            tests/packaging-sync.test.cjs \
            tests/electron-startup-ipc-privacy.test.cjs \
            tests/electron-ipc-sender-guard.test.cjs \
            tests/desktop-log-privacy.test.cjs \
            tests/startup-crash-diagnostics.test.cjs \
            tests/startup-performance.test.cjs \
            tests/deep-security-boundary.test.cjs \
            tests/renderer-auth-token-source.test.cjs \
            tests/deployment-profile.test.cjs \
            tests/windows-artifact-inventory.test.cjs \
            tests/excel-backup-retention.test.cjs
      - name: Execute existing worker Excel smoke in an isolated temporary directory
        run: node scripts/smokeExcel.cjs
      - name: Check packaged shared sync contract and Excel resources
        run: node scripts/checkPackagedSharedContract.cjs
      - name: Check manual Excel to DB review/identity guard
        run: node scripts/checkExcelDbSync.cjs
      - name: Validate Desktop renderer syntax without device preflight or NAS writes
        run: |
          node --check electron/monthlyWorkbookNaming.cjs
          node --check electron/monthlyWorkbookLocal.cjs
          node --check electron/companyExcelLocal.cjs
          node --check electron/excelDbSync.cjs
          node --check electron/excelDbSyncValues.cjs 
          node --check electron/desktopLog.cjs
          node --check electron/launcher.cjs
          node --check electron/preload.cjs
          node --check electron/securityPolicy.cjs
          node --check electron/main.cjs

  windows:
    name: Windows Desktop synthetic Excel and packaging source compatibility
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      KTC_EXPORT_ROOT: ktc-phase3-ci-excel
      KTC_GIA_CONG_SAMPLE_ROOT: ktc-phase3-ci-gc
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run real XLSX roundtrip and Windows source packaging contracts
        run: node --test tests/phase2-batch4-xlsx-isolated-roundtrip.test.cjs tests/packaging-sync.test.cjs tests/monthly-workbook-naming-parity.test.cjs tests/electron-startup-ipc-privacy.test.cjs tests/electron-ipc-sender-guard.test.cjs tests/desktop-log-privacy.test.cjs tests/startup-crash-diagnostics.test.cjs tests/deep-security-boundary.test.cjs tests/renderer-auth-token-source.test.cjs
      - run: node scripts/checkPackagedSharedContract.cjs
      - name: Windows release configuration, signing policy and update safety contracts
        run: node --test tests/release-signing.test.cjs tests/setup-auto-update.test.cjs tests/portable-upgrade-safety.test.cjs tests/deployment-profile.test.cjs
      - name: Windows release verification script syntax
        run: |
          node --check scripts/checkWindowsSigning.cjs
          node --check scripts/verifyWindowsRelease.cjs
          node --check scripts/deviceSmoke.cjs

  summary:
    name: Consolidated focused source gate
    needs: [backend, frontend, desktop, browser, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report exact source gate outcome
        env:
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DESKTOP: ${{ needs.desktop.result }}
          BROWSER: ${{ needs.browser.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          echo "Source SHA: ${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Backend: ${BACKEND}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Frontend: ${FRONTEND}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Desktop: ${DESKTOP}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Browser: ${BROWSER}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Windows: ${WINDOWS}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Not covered: authenticated browser UI, real Windows device, or isolated TiDB E2E." >> "${GITHUB_STEP_SUMMARY}"
          test "${BACKEND}" = "success" && test "${FRONTEND}" = "success" && test "${DESKTOP}" = "success" && test "${BROWSER}" = "success" && test "${WINDOWS}" = "success"
