name: Patch pending reject

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch reject buttons
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/manager/Reports.tsx')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'onClick={()=>setRejectOpen(true)}': 'onClick={()=>void rejectSelected()}',
              'onClick={()=>{setSelectedIds([Number(selectedDetail.id)]);setRejectOpen(true)}}': 'onClick={()=>{setSelectedIds([Number(selectedDetail.id)]);void rejectSelected()}}',
          }
          changed = 0
          for old, new in replacements.items():
              n = s.count(old)
              if n:
                  s = s.replace(old, new)
                  changed += n
          if changed != 2:
              raise SystemExit(f'Expected exactly 2 reject-button replacements, got {changed}')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit source fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/manager/Reports.tsx .github/workflows/fix-one-click-reject.yml
          git rm .github/workflows/fix-one-click-reject.yml
          git commit -m "fix(manager): reject pending report with one click"
          git push