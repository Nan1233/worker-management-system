name: KTC Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * 1'

permissions:
  contents: read

jobs:
  production-dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.package == 'backend'
        run: npm install --prefix ${{ matrix.package }}
      - if: matrix.package != 'backend'
        run: npm ci --prefix ${{ matrix.package }}
      - run: npm --prefix ${{ matrix.package }} run audit:prod
