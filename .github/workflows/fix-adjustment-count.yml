name: Fix adjustment count

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch worker form
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Remove every accidental per-machine "Chỉnh máy" block.
          path = Path('frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx')
          s = path.read_text(encoding='utf-8')
          block = re.compile(r'\s*<div><div className="machine-section-title">Chỉnh máy</div><div className="machine-quantity-row">\s*<label><span>Thời gian \(phút\)</span><input[^>]*value=\{line\.adjustmentMinutes\}[^>]*/></label>\s*<label><span>Số lần</span><input[^>]*value=\{line\.adjustmentCount\}[^>]*/></label>\s*</div></div>\s*')
          s, removed = block.subn('\n', s)
          if removed == 0:
              raise SystemExit('No per-machine adjustment block found')

          # 2) Add ONE overall count immediately below the machine/product selectors,
          #    outside the machineLines.map().
          marker = '''                                    </div>\n                                    <div className="machine-data-grid">'''
          count_ui = '''                                    </div>\n                                    {index === 0 && <div className="worker-field-block worker-machine-adjustment-count">\n                                        <label className="worker-field-label" htmlFor="adjustmentCount">Số lần chỉnh máy</label>\n                                        <div className="worker-deduction-input-row"><input id="adjustmentCount" className="worker-text-input worker-deduction-input" type="number" min="0" inputMode="numeric" value={form.adjustmentCount || ""} onChange={(event) => setForm((current) => ({ ...current, adjustmentCount: event.target.value.replace(/\\D/g, "") }))} placeholder="0" autoComplete="off" /><span className="worker-time-unit" aria-hidden="true">lần</span></div>\n                                    </div>}\n                                    <div className="machine-data-grid">'''
          if marker not in s:
              raise SystemExit('Machine selector marker not found')
          s = s.replace(marker, count_ui, 1)
          path.write_text(s, encoding='utf-8')

          # 3) Count belongs to the report, never to machine_lines.
          path = Path('frontend/src/pages/worker/processReportSubmission.ts')
          s = path.read_text(encoding='utf-8')
          s = s.replace('    adjustment_minutes:num(l.adjustmentMinutes),\n', '')
          s = s.replace('    adjustment_count:num(l.adjustmentCount),\n', '')
          if 'extra_data:{...args.extraData, adjustment_count:num(args.form.adjustmentCount)},' not in s:
              s = s.replace('    extra_data:args.extraData,', '    extra_data:{...args.extraData, adjustment_count:num(args.form.adjustmentCount)},', 1)
          path.write_text(s, encoding='utf-8')

          # 4) Remove the count field from the generic Trừ giờ details if a previous helper inserted it there.
          path = Path('frontend/src/pages/worker/components/ProcessTimeDeductionSection.tsx')
          s = path.read_text(encoding='utf-8')
          generic_count = re.compile(r'\s*\{selectedDeduction\.includes\("chinhMay"\) && <div className="worker-field-block">\s*<label className="worker-field-label" htmlFor="adjustmentCount">Số lần chỉnh máy</label>\s*<div className="worker-deduction-input-row"><input[^>]*id="adjustmentCount"[^>]*/>.*?</div>\s*</div>\}\s*', re.S)
          s, _ = generic_count.subn('\n', s)
          path.write_text(s, encoding='utf-8')

          # 5) Restore the overall count when editing.
          path = Path('frontend/src/pages/worker/WorkerReportEdit.tsx')
          s = path.read_text(encoding='utf-8')
          if 'adjustmentCount:' not in s:
              anchor = '          note: String(data.note || ""),'
              if anchor in s:
                  s = s.replace(anchor, anchor + '\n          adjustmentCount: String((data.extra_data || {}).adjustment_count ?? ""),', 1)
              else:
                  raise SystemExit('WorkerReportEdit form anchor not found')
          path.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          test "$(grep -o 'id=\"adjustmentCount\"' frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx | wc -l)" -eq 1
          ! grep -q 'value={line.adjustmentMinutes}' frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx
          ! grep -q 'value={line.adjustmentCount}' frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx
          ! grep -q 'adjustment_minutes:num(l.adjustmentMinutes)' frontend/src/pages/worker/processReportSubmission.ts
          ! grep -q 'adjustment_count:num(l.adjustmentCount)' frontend/src/pages/worker/processReportSubmission.ts
          grep -q 'adjustment_count:num(args.form.adjustmentCount)' frontend/src/pages/worker/processReportSubmission.ts
      - name: Commit and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx frontend/src/pages/worker/components/ProcessTimeDeductionSection.tsx frontend/src/pages/worker/processReportSubmission.ts frontend/src/pages/worker/WorkerReportEdit.tsx
          git rm .github/workflows/fix-adjustment-count.yml
          git commit -m 'fix(worker): place adjustment count under machine selector [skip ci]'
          git push