name: Fix adjustment count

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove per-machine adjustment fields
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx')
          s = path.read_text(encoding='utf-8')

          # Remove all blocks titled "Chỉnh máy" that are inside machine-data-grid.
          # Adjustment minutes are already the Trừ giờ value; the count is report-level.
          pattern = re.compile(
              r'\s*<div><div className="machine-section-title">Chỉnh máy</div>'
              r'.*?value=\{line\.adjustmentMinutes\}.*?'
              r'value=\{line\.adjustmentCount\}.*?'
              r'</div></div>',
              re.S,
          )
          s, removed = pattern.subn('\n', s)
          if removed == 0:
              raise SystemExit('No duplicated per-machine Chỉnh máy block found')

          # Keep exactly one report-level count field outside machineLines.map().
          count_block = re.compile(
              r'\s*<div className="worker-field-block worker-machine-adjustment-count">.*?</div>\s*',
              re.S,
          )
          s, _ = count_block.subn('\n', s)

          marker = '''                        </div>\n                        <div className="machine-lines-list">'''
          count_ui = '''                        </div>\n                        <div className="worker-field-block worker-machine-adjustment-count">\n                            <label className="worker-field-label" htmlFor="adjustmentCount">Số lần chỉnh máy</label>\n                            <div className="worker-deduction-input-row"><input id="adjustmentCount" className="worker-text-input worker-deduction-input" type="number" min="0" inputMode="numeric" value={form.adjustmentCount || ""} onChange={(event) => setForm((current) => ({ ...current, adjustmentCount: event.target.value.replace(/\\D/g, "") }))} placeholder="0" autoComplete="off" /><span className="worker-time-unit" aria-hidden="true">lần</span></div>\n                        </div>\n                        <div className="machine-lines-list">'''
          if marker not in s:
              raise SystemExit('Machine list marker not found')
          s = s.replace(marker, count_ui, 1)
          path.write_text(s, encoding='utf-8')

          # Remove any generic count field from Trừ giờ; count belongs in Sản phẩm & máy.
          path = Path('frontend/src/pages/worker/components/ProcessTimeDeductionSection.tsx')
          s = path.read_text(encoding='utf-8')
          generic = re.compile(
              r'\s*\{selectedDeduction\.includes\("chinhMay"\) && <div className="worker-field-block">.*?</div>\}\s*',
              re.S,
          )
          s, _ = generic.subn('\n', s)
          path.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          test "$(grep -o 'id=\"adjustmentCount\"' frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx | wc -l)" -eq 1
          ! grep -q 'value={line.adjustmentMinutes}' frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx
          ! grep -q 'value={line.adjustmentCount}' frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx
          ! grep -q 'adjustment_minutes:num(l.adjustmentMinutes)' frontend/src/pages/worker/processReportSubmission.ts
          ! grep -q 'adjustment_count:num(l.adjustmentCount)' frontend/src/pages/worker/processReportSubmission.ts
      - name: Commit and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx frontend/src/pages/worker/components/ProcessTimeDeductionSection.tsx
          git rm .github/workflows/fix-adjustment-count.yml
          git commit -m 'fix(worker): keep adjustment count separate from machine rows [skip ci]'
          git push