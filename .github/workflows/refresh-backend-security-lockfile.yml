name: Refresh backend security lockfile

on:
  push:
    branches:
      - test
    paths:
      - "backend/package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backend-security-lockfile-test
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Regenerate backend lockfile from security overrides
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify vulnerable packages are patched
        working-directory: backend
        run: |
          node -e "const p=require('./package-lock.json'); const cmp=(a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)-(y[i]||0)}return 0}; for (const [name,min] of [['body-parser','2.4.0'],['ip-address','10.7.5']]) { const v=p.packages['node_modules/'+name]?.version; if (!v || cmp(v,min)<0) { console.error(name+' resolved to '+v+', expected >= '+min); process.exitCode=1; } else console.log(name+' '+v); }"
          npm audit --audit-level=high
      - name: Commit lockfile update to test
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          git commit -m "security(test): refresh backend dependency lockfile"
          git push origin HEAD:test
