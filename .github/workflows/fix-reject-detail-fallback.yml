name: Patch reject detail target

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch reject target fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/manager/Reports.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'const rejectSelected=async()=>{if(lock.current||actionLoading||!selectedIds.length||!canReview)return;const reason=rejectReason==="Lý do khác"?rejectDetail.trim():[rejectReason,rejectDetail.trim()].filter(Boolean).join(": ");if(!reason)return showToast("Vui lòng nhập lý do từ chối");lock.current=true;setActionLoading(true);try{await rejectSelectedTempReports(targets,reason);showToast(`Đã từ chối ${selectedIds.length} báo cáo`,"success");setRejectOpen(false);setRejectDetail("");setSelectedIds([]);setSelectedDetail(null);await loadReports();}catch(err){showToast(axios.isAxiosError(err)?err.response?.data?.message||"Từ chối báo cáo thất bại":"Từ chối báo cáo thất bại");}finally{lock.current=false;setActionLoading(false);}};'
          new = 'const rejectSelected=async()=>{const ids=selectedIds.length?selectedIds:(selectedDetail?.id?[Number(selectedDetail.id)]:[]);if(lock.current||actionLoading||!ids.length||!canReview)return;const reason=rejectReason==="Lý do khác"?rejectDetail.trim():[rejectReason,rejectDetail.trim()].filter(Boolean).join(": ");if(!reason)return showToast("Vui lòng nhập lý do từ chối");const rejectTargets=reports.filter(r=>ids.includes(Number(r.id))).map(r=>({id:Number(r.id),expected_updated_at:r.updated_at||null}));if(!rejectTargets.length&&selectedDetail?.id)rejectTargets.push({id:Number(selectedDetail.id),expected_updated_at:selectedDetail.updated_at||null});lock.current=true;setActionLoading(true);try{await rejectSelectedTempReports(rejectTargets,reason);showToast(`Đã từ chối ${ids.length} báo cáo`,"success");setRejectOpen(false);setRejectDetail("");setSelectedIds([]);setSelectedDetail(null);await loadReports();}catch(err){showToast(axios.isAxiosError(err)?err.response?.data?.message||"Từ chối báo cáo thất bại":"Từ chối báo cáo thất bại");}finally{lock.current=false;setActionLoading(false);}};'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one rejectSelected function, got {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit source fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/manager/Reports.tsx .github/workflows/fix-reject-detail-fallback.yml
          git rm .github/workflows/fix-reject-detail-fallback.yml
          git commit -m "fix(manager): support direct reject from report detail"
          git push