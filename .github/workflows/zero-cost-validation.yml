name: KTC Zero Extra Cost Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-mysql-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ktc_ci_root_only
          MYSQL_DATABASE: worker_management_staging_local
          MYSQL_USER: ktc_staging_local
          MYSQL_PASSWORD: ktc_ci_local_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pktc_ci_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      NODE_ENV: test
      PORT: "19080"
      KTC_RUNTIME_ENV_CLASS: STAGING
      KTC_WORKER_QUEUE_ISOLATED: YES
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: worker_management_staging_local
      DB_USER: ktc_staging_local
      DB_PASSWORD: ktc_ci_local_only
      DB_SSL: "false"
      JWT_SECRET: ktc_ci_jwt_only_not_production
      DUPLICATE_CONFIRMATION_SECRET: ktc_ci_duplicate_only_not_production
      ENABLE_GOOGLE_SHEET_SYNC: "false"
      ENABLE_SERVER_HEAVY_EXCEL: "false"
      ENABLE_SERVER_COMPANY_EXCEL: "false"
      INLINE_SYNC_TRIGGER: "false"
      LOCAL_BACKEND_URL: http://127.0.0.1:19080
      VITE_API_URL: http://127.0.0.1:19080/api
      KTC_VALIDATION_DIR: validation-artifacts
      KTC_BACKUP_DIR: ${{ github.workspace }}/validation-artifacts/backups

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install pinned dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Prepare artifact directory
        run: mkdir -p validation-artifacts

      - name: Verify canonical database source
        run: |
          test -f backend/database/KTC_FULL_DATABASE_CANONICAL_20260817.sql

      - name: Seed disposable CI fixtures
        run: npm run validate:zero-cost:seed | tee validation-artifacts/seed.log

      - name: Backend regression
        run: npm --prefix backend test | tee validation-artifacts/backend-tests.log

      - name: Security regression
        run: npm run validate:zero-cost:security | tee validation-artifacts/security-tests.log

      - name: Start local backend
        run: |
          npm --prefix backend start > validation-artifacts/backend.log 2>&1 &
          echo $! > validation-artifacts/backend.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19080/api/health/live >/dev/null && \
               curl --fail --silent http://127.0.0.1:19080/api/health/ready >/dev/null; then
              echo "KTC_BACKEND_HEALTH=PASS" | tee validation-artifacts/backend-health.log
              exit 0
            fi
            sleep 2
          done
          cat validation-artifacts/backend.log
          exit 1

      - name: Frontend lint typecheck tests build
        run: npm --prefix frontend run check | tee validation-artifacts/frontend-check.log

      - name: Critical 23-case E2E
        run: npm run validate:zero-cost:e2e | tee validation-artifacts/critical-e2e.log

      - name: Controlled API performance and load
        run: npm run validate:zero-cost:perf | tee validation-artifacts/perf-load.log

      - name: DB EXPLAIN evidence
        run: node scripts/zero-cost/db-explain-runner.cjs | tee validation-artifacts/db-explain.log

      - name: Excel runtime
        run: npm run validate:zero-cost:excel | tee validation-artifacts/excel-runtime.log

      - name: Backup and verify disposable DB
        run: |
          npm --prefix backend run backup:db | tee validation-artifacts/backup.log
          BACKUP_FILE=$(find "$KTC_BACKUP_DIR" -maxdepth 1 -type f \( -name '*.jsonl.gz' -o -name '*.jsonl.gz.enc' \) -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$BACKUP_FILE"
          echo "$BACKUP_FILE" > validation-artifacts/latest-backup-path.txt
          npm --prefix backend run backup:verify -- "$BACKUP_FILE" | tee validation-artifacts/backup-verify.log

      - name: Restore rehearsal into new disposable DB
        env:
          KTC_RESTORE_DB_HOST: 127.0.0.1
          KTC_RESTORE_DB_PORT: "3306"
          KTC_RESTORE_DB_USER: root
          KTC_RESTORE_DB_PASSWORD: ktc_ci_root_only
          KTC_RESTORE_DB_NAME: worker_management_staging_local_rehearsal
          KTC_RESTORE_DB_SSL: "false"
        run: |
          BACKUP_FILE=$(cat validation-artifacts/latest-backup-path.txt)
          npm --prefix backend run restore:rehearsal -- --file "$BACKUP_FILE" | tee validation-artifacts/restore-rehearsal.log

      - name: Collect report
        if: always()
        run: npm run validate:zero-cost

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktc-zero-cost-validation
          path: validation-artifacts/
          if-no-files-found: error
          retention-days: 7
