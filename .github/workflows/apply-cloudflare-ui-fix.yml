name: Apply KTC Cloudflare UI Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove Lồng khí option and add Cloudflare frontend config
        shell: python
        run: |
          from pathlib import Path

          component = Path('frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx')
          text = component.read_text(encoding='utf-8')

          replacements = [
              ('useState<"MANUAL" | "MACHINE" | "AIR">', 'useState<"MANUAL" | "MACHINE">'),
              ('const handleLongExecutionModeChange = (mode: "MANUAL" | "MACHINE" | "AIR") => {', 'const handleLongExecutionModeChange = (mode: "MANUAL" | "MACHINE") => {'),
              ('                                    <button type="button" className={longExecutionMode === "AIR" ? "active" : ""} onClick={() => handleLongExecutionModeChange("AIR")}>Khí</button>\n', ''),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected source text: {old!r}')
              text = text.replace(old, new, 1)

          component.write_text(text, encoding='utf-8')

          wrangler = Path('frontend/wrangler.jsonc')
          wrangler.write_text('''{
  "$schema": "./node_modules/wrangler/config-schema.json",
  "name": "ktc-frontend",
  "compatibility_date": "2026-09-05",
  "workers_dev": true,
  "assets": {
    "directory": "./dist",
    "not_found_handling": "single-page-application"
  }
}
''', encoding='utf-8')

      - name: Commit changes to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx frontend/wrangler.jsonc
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(worker): simplify long mode and add Cloudflare frontend config"
          git push origin main
