name: Verify manager Excel v3
on:
  push:
    branches: [main]
    paths:
      - frontend/src/pages/manager/ManagerReportGrid.tsx
      - frontend/src/pages/manager/ManagerExcelReports.css
      - frontend/src/services/productionService.ts
      - .github/workflows/verify-manager-excel-v3.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build
      - name: Remove one-time verifier
        run: |
          rm -f .github/workflows/verify-manager-excel-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/verify-manager-excel-v3.yml
          git commit -m "chore: remove one-time manager Excel verifier" || true
          git push