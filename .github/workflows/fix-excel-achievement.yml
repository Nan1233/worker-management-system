name: Apply Excel KPI formula fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Excel KPI formula
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/services/consolidatedExcelExportService.js')
          s = p.read_text(encoding='utf-8')
          old = '''  const standard = machineMetrics?.machine_count > 0
    ? 0
    : toNumber(report.standard_output);

  const actualTime =
    toNumber(
      report.actual_time
    );

  const outputPerHour =
    actualTime > 0
      ? totalOutput / actualTime
      : 0;

  const achievementRate = machineMetrics?.machine_count > 0
    ? (Number(machineMetrics.maximum_output || 0) > 0 ? Number(machineMetrics.counted_output || 0) / Number(machineMetrics.maximum_output) : 0)
    : (standard > 0 ? outputPerHour / standard : 0);
'''
          new = '''  // Định mức Excel = định mức SP/giờ × thời gian thực tế.
  const standardPerHour = machineMetrics?.machine_count > 0
    ? 0
    : toNumber(report.standard_output);

  const actualTime =
    toNumber(
      report.actual_time
    );

  const standard = standardPerHour > 0 && actualTime > 0
    ? standardPerHour * actualTime
    : 0;

  const outputPerHour =
    actualTime > 0
      ? totalOutput / actualTime
      : 0;

  // Tỷ lệ đạt trong Excel = % thực tích
  // = Thực tích / Định mức × % học việc.
  const achievementRate = machineMetrics?.machine_count > 0
    ? (Number(machineMetrics.maximum_output || 0) > 0
      ? Number(machineMetrics.counted_output || 0) / Number(machineMetrics.maximum_output)
      : 0)
    : (standard > 0 ? (totalOutput / standard) * trainingFactor(report.training_percent) : 0);
'''
          if old not in s:
              raise SystemExit('Target block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/consolidatedExcelExportService.js
          git commit -m "fix: correct Excel achievement rate and standard output"
          rm -f .github/workflows/fix-excel-achievement.yml
          git add .github/workflows/fix-excel-achievement.yml
          git commit -m "chore: remove temporary Excel KPI workflow"
          git push origin HEAD:main
