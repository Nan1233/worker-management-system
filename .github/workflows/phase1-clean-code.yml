name: Phase 1 clean-code regression

on:
  pull_request:
    branches: [test]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/phase1-clean-code.yml'
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Refactor contract
        run: node --test tests/source-patch-removal.contract.test.js

  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
