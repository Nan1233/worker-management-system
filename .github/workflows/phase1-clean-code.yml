name: Phase 1 clean-code regression

on:
  pull_request:
    branches: [test]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/phase1-clean-code.yml'
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend refactor regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Approved edit concurrency and source-patch removal contract
        run: node --test tests/source-patch-removal.contract.test.js tests/approved-edit-concurrency.test.js
      - name: GC physical-machine accounting and Excel export integrity regression
        run: node --test tests/gc-machine-time-remote-smoke.test.js tests/source-integrity.test.js
      - name: Historical standard and machine/product ambiguity regressions
        run: node --test tests/historical-standard-overlap-guard.test.js tests/standard-ambiguity-fail-closed.test.js
      - name: GC non-product work submission regression
        run: node --test tests/non-product-work-validation.test.js
      - name: Report idempotency and logical duplicate regression
        run: node --test tests/logical-duplicate-transaction.test.js
      - name: Full backend tests (informational — existing failures outside this refactor)
        continue-on-error: true
        run: npm test

  frontend:
    name: Frontend lint, typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Full frontend tests (informational — existing failures outside this refactor)
        continue-on-error: true
        run: npm test
