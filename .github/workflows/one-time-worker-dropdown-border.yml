name: one-time worker dropdown border

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply compact dropdown styling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/worker/ProcessPage.polished.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* One-time worker dropdown interaction polish */'
          if marker not in s:
              s += '''\n\n/* One-time worker dropdown interaction polish */\n.worker-form-page .worker-dropdown-box {\n  border: 1px solid #d5e0ec !important;\n  border-radius: 8px !important;\n  background: #fff !important;\n  overflow: hidden !important;\n}\n.worker-form-page .worker-dropdown-title {\n  width: 100% !important;\n  min-height: 34px !important;\n  height: 34px !important;\n  padding: 0 9px !important;\n  border: 0 !important;\n  border-radius: 0 !important;\n  background: #fff !important;\n  box-sizing: border-box !important;\n  font-size: 11px !important;\n}\n@media (max-width: 680px) {\n  .worker-form-page .worker-dropdown-box {\n    border-radius: 8px !important;\n  }\n  .worker-form-page .worker-dropdown-title {\n    min-height: 34px !important;\n    height: 34px !important;\n    font-size: 10.5px !important;\n  }\n}\n'''
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/one-time-worker-dropdown-border.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/worker/ProcessPage.polished.css .github/workflows/one-time-worker-dropdown-border.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(worker): add borders to deduction and NG controls'
          git push
