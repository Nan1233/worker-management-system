name: Admin Ops PR Verification

on:
  push:
    branches:
      - verify/admin-ops-20261012
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ops-pr-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Check backend source
        run: npm run check --prefix backend
      - name: Run backend JavaScript and contract tests
        working-directory: backend
        run: node --test tests/*.test.js tests/*.test.cjs

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Typecheck and build production bundle
        run: npm run build --prefix frontend
