name: Admin Ops PR Verification

on:
  push:
    branches:
      - verify/admin-ops-20261012
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-ops-pr-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Check backend source
        run: npm run check --prefix backend
      - name: Run critical permission and authorization tests
        working-directory: backend
        run: node --test tests/admin-ops-scope.contract.test.js tests/permission-matrix.test.cjs tests/scope-ownership-escalation.test.cjs tests/authorization-process-scope.test.js tests/authorization-f09-scope.test.js
      - name: Run remaining backend tests with per-test timeout
        working-directory: backend
        run: node --test --test-timeout=60000 tests/*.test.js tests/*.test.cjs

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Typecheck and build production bundle
        run: npm run build --prefix frontend

  baseline-test-branch:
    name: Check existing failures on test baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout unchanged test branch
        uses: actions/checkout@v4
        with:
          ref: test
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Run previously failing audit and Excel tests on test baseline
        working-directory: backend
        run: node --test --test-timeout=60000 tests/audit-historical-machine-hours.test.js tests/auditHistoricalMachineHoursRemote.test.js tests/excel-monthly-business-rules.test.js tests/excel-template-loader.test.js tests/gc-worker-report-excel.test.js
