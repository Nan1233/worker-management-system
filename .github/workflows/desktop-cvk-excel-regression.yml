name: Desktop CVK Excel Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cvk-excel-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --check electron/workerReportTemplateLocal.v2.cjs
      - run: node --check electron/monthlyWorkbookLocal.cjs
      - run: node --check electron/companyExcelLocal.cjs
      - run: node --check electron/excelExportContractPatch.v6.cjs
      - run: npm run test:machine-time
      - run: node --test tests/monthly-workbook-physical-events.test.cjs
      - name: Phase 2 actual XLSX round-trip shared-machine contract
        run: node --test tests/phase2-gc-xlsx-roundtrip.test.cjs
      - run: node --test tests/production-calculation-engine.test.cjs
      - run: node --test tests/company-excel-shared-machine.test.cjs
      - run: npm run test:cvk-export
      - run: node --test tests/mai-do-export-parity.test.cjs
      - run: node scripts/smokeExcel.cjs
