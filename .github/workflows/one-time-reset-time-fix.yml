name: One-time worker reset time fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[reset-time-fix-done]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch reset time and draft autosave race
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/pages/worker/ProcessPage.tsx')
          text = path.read_text(encoding='utf-8')

          marker = '    const isRestoringDraftRef = useRef(false);\n'
          insert = marker + '    const draftSaveTimerRef = useRef<number | null>(null);\n    const resetVersionRef = useRef(0);\n'
          if 'const draftSaveTimerRef = useRef<number | null>(null);' not in text:
              if marker not in text:
                  raise SystemExit('Could not find draft ref marker')
              text = text.replace(marker, insert, 1)

          old = '''    useEffect(() => {\n        if (loadingWorker || loadingMasterData || submitting) return;\n\n        const snapshot = {'''
          new = '''    useEffect(() => {\n        if (loadingWorker || loadingMasterData || submitting) return;\n\n        const resetVersion = resetVersionRef.current;\n        const snapshot = {'''
          if old not in text:
              raise SystemExit('Could not find autosave effect start')
          text = text.replace(old, new, 1)

          old = '''        const timer = window.setTimeout(() => {\n            if (hasMeaningfulProcessDraft(snapshot)) {\n                saveProcessDraft(snapshot);\n            } else {\n                clearProcessDraft(process);\n            }\n        }, 700);\n\n        return () => window.clearTimeout(timer);'''
          new = '''        const timer = window.setTimeout(() => {\n            if (resetVersionRef.current !== resetVersion) return;\n            if (hasMeaningfulProcessDraft(snapshot)) {\n                saveProcessDraft(snapshot);\n            } else {\n                clearProcessDraft(process);\n            }\n            draftSaveTimerRef.current = null;\n        }, 700);\n        draftSaveTimerRef.current = timer;\n\n        return () => {\n            window.clearTimeout(timer);\n            if (draftSaveTimerRef.current === timer) draftSaveTimerRef.current = null;\n        };'''
          if old not in text:
              raise SystemExit('Could not find autosave timer block')
          text = text.replace(old, new, 1)

          old = '''    const handleReset = () => {\n        const hasEnteredData = Boolean('''
          new = '''    const handleReset = () => {\n        const hasEnteredData = Boolean('''
          if old not in text:
              raise SystemExit('Could not find handleReset')
          # no-op replacement above is intentional; actual reset guard is inserted after confirmation

          old = '''        if (hasEnteredData && !window.confirm("Làm mới sẽ xóa dữ liệu bạn đang nhập. Bạn có chắc muốn tiếp tục?")) {\n            return;\n        }\n\n        setForm((prev) => ({\n\n            ...initialForm,'''
          new = '''        if (hasEnteredData && !window.confirm("Làm mới sẽ xóa dữ liệu bạn đang nhập. Bạn có chắc muốn tiếp tục?")) {\n            return;\n        }\n\n        // Invalidate any pending draft autosave before clearing the form.\n        resetVersionRef.current += 1;\n        isRestoringDraftRef.current = false;\n        if (draftSaveTimerRef.current !== null) {\n            window.clearTimeout(draftSaveTimerRef.current);\n            draftSaveTimerRef.current = null;\n        }\n        clearProcessDraft(process);\n\n        setForm((prev) => ({\n\n            ...initialForm,\n            // Explicitly clear every time field so a reset can never retain\n            // the previous working/deduction/total time values.\n            actualHours: "",\n            actualMinutes: "",\n            actualTime: "",\n            deductionTime: "",\n            totalTime: "",'''
          if old not in text:
              raise SystemExit('Could not find reset form block')
          text = text.replace(old, new, 1)

          # Remove the later duplicate clearProcessDraft in handleReset; the draft was already invalidated above.
          old = '''        clearProcessDraft(process);\n\n    };\n        return ('''
          new = '''    };\n        return ('''
          if old not in text:
              raise SystemExit('Could not find trailing reset draft clear')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/worker/ProcessPage.tsx
          git rm .github/workflows/one-time-reset-time-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(worker): clear time fields on form reset [reset-time-fix-done]"
          git push origin main
