name: One-time report detail repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch report detail/edit sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/models/productionTempReadModel.js')
          s = p.read_text()
          old = '''SELECT pr.*, w.worker_code, u.full_name, p.process_name,\n                    reviewer.full_name AS reviewer_name'''
          new = '''SELECT pr.*, w.worker_code, u.full_name, p.process_name, p.process_code,\n                    reviewer.full_name AS reviewer_name'''
          if old not in s: raise SystemExit('backend target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('frontend/src/services/productionService.ts')
          s = p.read_text()
          old = '''export const getReportById=async(id:number,source?:string|null)=>{const normalizedSource=String(source||"").toLowerCase();const url=normalizedSource==="pending"||normalizedSource==="temp"?`/production-temp/${id}`:`/production/${id}`;const res=await api.get(url);return res.data.data||res.data;};'''
          new = '''export const getReportById=async(id:number,source?:string|null)=>{const normalizedSource=String(source||"").toLowerCase();const url=normalizedSource==="pending"||normalizedSource==="temp"?`/production-temp/${id}`:`/production/${id}`;const res=await api.get(url,{params:{_t:Date.now()},headers:{"Cache-Control":"no-cache","Pragma":"no-cache"}});return res.data.data||res.data;};'''
          if old not in s: raise SystemExit('service target not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('frontend/src/pages/worker/ProductionDetail.tsx')
          s = p.read_text()
          old = '''                          <div><span>Chỉnh máy</span><strong>{number(line.adjustment_minutes)} phút · {quantity(line.adjustment_count)} lần</strong></div>\n'''
          if old not in s: raise SystemExit('detail target not found')
          p.write_text(s.replace(old, '', 1))

          p = Path('frontend/src/pages/worker/WorkerReportEdit.tsx')
          s = p.read_text()
          old = '''        setExtraData(Object.fromEntries(Object.entries(data.extra_data || {}).map(([key, value]) => [key, value == null ? "" : String(value)])));'''
          new = '''        setExtraData(Object.fromEntries(Object.entries(data.extra_data || {}).filter(([key]) => key !== "adjustment_count").map(([key, value]) => [key, value == null ? "" : String(value)])));'''
          if old not in s: raise SystemExit('edit extra_data target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: TypeScript syntax check
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund && npx tsc --noEmit --pretty false
      - name: Commit repaired sources and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/models/productionTempReadModel.js frontend/src/services/productionService.ts frontend/src/pages/worker/ProductionDetail.tsx frontend/src/pages/worker/WorkerReportEdit.tsx .github/workflows/one-time-report-fix.yml
          git rm .github/workflows/one-time-report-fix.yml
          git commit -m 'fix: restore report detail and edit data [skip ci]'
          git push
