name: Patch manager Excel UX v3
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-manager-excel-v3.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Excel UX v3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('frontend/src/services/productionService.ts')
          s=p.read_text(encoding='utf-8')
          anchor='export const deleteReport=async(id:number,reason:string)=>{const res=await api.delete(`/production/${id}`,{data:{reason:String(reason||"").trim()}});return res.data;};'
          add=anchor+'\nexport const createApprovedReportFromExcel=async(data:ProductionReport)=>{const res=await api.post("/production/excel-sync",{changes:[{create:true,data,source:{file:"Manager Web",sheet:"Quản lý báo cáo"}}]});const result=res.data?.results?.[0];if(!result?.success)throw new Error(result?.message||res.data?.message||"Không thể thêm báo cáo");return result;};'
          if 'createApprovedReportFromExcel=async' not in s:
              if anchor not in s: raise SystemExit('service anchor missing')
              s=s.replace(anchor,add,1)
              p.write_text(s,encoding='utf-8')

          p=Path('frontend/src/pages/manager/ManagerReportGrid.tsx')
          s=p.read_text(encoding='utf-8')
          s=s.replace('deleteReport, getApprovedReports, getReportById, invalidateManagerReportCaches, updateReport','createApprovedReportFromExcel, deleteReport, getApprovedReports, getReportById, invalidateManagerReportCaches, updateReport',1)
          s=s.replace('type ProcessTab = { label: string; processId: number };','type ProcessTab = { label: string; processId: number; processCode: string };',1)
          s=s.replace('{ label: "CÁN", processId: 60002 }','{ label: "CÁN", processId: 60002, processCode: "CAN" }',1)
          s=s.replace('{ label: "ÉP", processId: 60003 }','{ label: "ÉP", processId: 60003, processCode: "EP" }',1)
          s=s.replace('{ label: "XLBV", processId: 60004 }','{ label: "XLBV", processId: 60004, processCode: "XLBV" }',1)
          s=s.replace('{ label: "Cắt lồng", processId: 1 }','{ label: "Cắt lồng", processId: 1, processCode: "GC" }',1)
          s=s.replace('{ label: "TT Mài", processId: 2 }','{ label: "TT Mài", processId: 2, processCode: "MAI" }',1)
          s=s.replace('{ label: "TT Đo", processId: 60001 }','{ label: "TT Đo", processId: 60001, processCode: "DO" }',1)
          s=s.replace('{ label: "TT Kiểm 1", processId: 3 }','{ label: "TT Kiểm 1", processId: 3, processCode: "KIEM1" }',1)
          s=s.replace('{ label: "TT Kiểm 2", processId: 4 }','{ label: "TT Kiểm 2", processId: 4, processCode: "KIEM2" }',1)
          s=s.replace('[saving,setSaving]=useState(false),[loading,setLoading]', '[saving,setSaving]=useState(false),[loading,setLoading]',1)
          old='const selectRow=(r:ProductionReport)=>{if(!editing)setSelectedId(Number(r.id))};const edit=(r:ProductionReport)=>{const id=Number(r.id);setSelectedId(id);setDrafts(p=>({...p,[id]:{...r,deductions:[...(r.deductions||[])],defects:[...(r.defects||[])]}}));setEditing(id);setDirty(false)};const field=(id:number,k:keyof ProductionReport,v:string|number)=>{setDirty(true);setDrafts(p=>({...p,[id]:{...p[id],[k]:v}}))};'
          new='''const selectRow=(r:ProductionReport)=>{if(!editing){setSelectedId(Number(r.id));edit(r)}};const edit=(r:ProductionReport)=>{const id=Number(r.id);setSelectedId(id);setDrafts(p=>({...p,[id]:{...r,deductions:[...(r.deductions||[])],defects:[...(r.defects||[])]}}));setEditing(id);setDirty(false)};const field=(id:number,k:keyof ProductionReport,v:string|number)=>{setDirty(true);setDrafts(p=>({...p,[id]:{...p[id],[k]:v}}))};'''
          if old not in s: raise SystemExit('edit anchor missing')
          s=s.replace(old,new,1)
          old='const save=async(r:ProductionReport)=>{const id=Number(r.id),d=drafts[id];if(!d)return;const totalHours=n(d.actual_time)+dsum(d);'
          new='''const save=async(r:ProductionReport)=>{const id=Number(r.id),d=drafts[id];if(!d)return;if(id<0){try{setSaving(true);await createApprovedReportFromExcel({...d,id:undefined,process_code:process.processCode,worker_code:String(d.worker_code||''),work_date:String(d.work_date||''),operation_mode:d.operation_mode||'MANUAL',operation_type:d.operation_type||undefined});showToast("Đã thêm báo cáo","success");setEditing(null);setSelectedId(null);setDirty(false);setDrafts({});invalidateManagerReportCaches();await load()}catch(e){showToast(axios.isAxiosError(e)?e.response?.data?.message||"Không thể thêm báo cáo":(e as Error).message||"Không thể thêm báo cáo")}finally{setSaving(false)}return}const totalHours=n(d.actual_time)+dsum(d);'''
          if old not in s: raise SystemExit('save anchor missing')
          s=s.replace(old,new,1)
          old='const toolbarAdd=()=>showToast("Thêm báo cáo mới cần gắn với công nhân cụ thể; dùng Chờ duyệt để tạo báo cáo mới.");'
          new='''const toolbarAdd=()=>{if(editing!=null){showToast("Hãy lưu hoặc hủy dòng đang sửa trước");return}const base=selectedId!=null?rows.find(x=>Number(x.id)===selectedId):rows[0];const today=getToday();const id=-Date.now();const draft:ProductionReport={...(base||{process_id:process.processId,work_date:today,shift:"",machine_no:"",product_name:"",total_time:0,actual_time:0,deduction_time:0,standard_output:0,actual_output:0,tt_ok:0,tt_ng:0,kqd_dap_lai:0,kqd_tuot:0,vo_do_long:0,xuoc_do_long:0,cong_gay:0,xoay:0,khong_dut:0,bavia_hut:0,ppcm:0,loi_cao_su:0,ng_kich_thuoc:0,cat_lem:0,note:""}),id,process_id:process.processId,work_date:base?.work_date||today,worker_code:base?.worker_code||"",full_name:base?.full_name||"",shift:base?.shift||"",machine_no:base?.machine_no||"",product_name:base?.product_name||"",actual_time:n(base?.actual_time),deduction_time:n(base?.deduction_time),total_time:n(base?.total_time),actual_output:n(base?.actual_output),tt_ok:n(base?.tt_ok),tt_ng:n(base?.tt_ng),deductions:[...(base?.deductions||[])],defects:[...(base?.defects||[])],note:base?.note||""};setRows(p=>[draft,...p]);setTotal(t=>t+1);setSelectedId(id);setDrafts({[id]:draft});setEditing(id);setDirty(true)};'''
          if old not in s: raise SystemExit('add anchor missing')
          s=s.replace(old,new,1)
          # Hide status column and make date/worker editable.
          s=s.replace('<th>Ghi chú</th><th>Trạng thái</th>','<th>Ghi chú</th>',1)
          s=s.replace('<td className="sticky date">{dateFmt(r.work_date)}</td><td className="sticky code">{txt(r.worker_code)}</td><td className="sticky name">{txt(r.full_name)}</td>', '<td className="sticky date">{is?input(id,"work_date",r.work_date,"date","Ngày làm việc"):dateFmt(r.work_date)}</td><td className="sticky code">{is?input(id,"worker_code",r.worker_code||"","text","Mã công nhân"):txt(r.worker_code)}</td><td className="sticky name">{txt(r.full_name)}</td>',1)
          # Machine and product are true suggestions; click row immediately enters edit.
          s=s.replace('const input=(id:number,k:keyof ProductionReport,v:unknown,type="text")=><input className="manager-excel-cell-input"', 'const input=(id:number,k:keyof ProductionReport,v:unknown,type="text",hint?:string)=><input className="manager-excel-cell-input"',1)
          s=s.replace('placeholder={hintFor(k)} title={hintFor(k)} list={listFor(k)} aria-label={hintFor(k)} onChange=', 'placeholder={hint||hintFor(k)} title={hint||hintFor(k)} list={listFor(k)} aria-label={hint||hintFor(k)} onChange=',1)
          # Remove inline status controls at row end.
          s=s.replace('<td>{is?<><button type="button" disabled={saving} onClick={e=>{e.stopPropagation();void save(original)}}>Lưu</button><button type="button" disabled={saving} onClick={e=>{e.stopPropagation();cancel(id)}}>Hủy</button></>:<span className="approved-badge">Đã duyệt</span>}</td>','',1)
          # Ensure colSpan remains valid.
          s=s.replace('30+deductions.length+defects.length','29+deductions.length+defects.length')
          p.write_text(s,encoding='utf-8')

          css=Path('frontend/src/pages/manager/ManagerExcelReports.css')
          c=css.read_text(encoding='utf-8')
          c += '''\n/* v3: cell editing should look like Excel, without layout jump or rounded input boxes */\n.manager-excel-table td{position:relative}.manager-excel-table td .manager-excel-cell-input{border:1px solid transparent!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;outline:none!important;height:100%;min-height:28px;margin:0;padding:4px 6px;box-sizing:border-box;font:inherit;color:inherit}.manager-excel-table td .manager-excel-cell-input:hover{background:#fffdf0!important;border-color:#d8dee8!important}.manager-excel-table td .manager-excel-cell-input:focus{background:#fff!important;border:1px solid #2f80ed!important;border-radius:0!important;box-shadow:inset 0 0 0 1px #2f80ed!important;outline:none!important}.manager-excel-table tbody tr.editing td{background:#fffdf3}.manager-excel-table tbody tr.editing td.sticky{background:#fffdf3}.manager-excel-table tbody tr.selected td{background:#e7f0ff}.manager-excel-table tbody tr.selected td.sticky{background:#e7f0ff}.manager-excel-table tbody tr.editing td .manager-excel-cell-input{background:transparent!important}.manager-excel-table tbody tr.editing td .manager-excel-cell-input:focus{background:#fff!important}.manager-excel-table td.editable-cell:has(.manager-excel-cell-input:focus){background:#dceaff!important;box-shadow:inset 0 0 0 2px #2f80ed}.manager-excel-table td .manager-excel-cell-input::placeholder{color:#9aa8bb;font-size:11px}.manager-excel-toolbar .tool-add,.manager-excel-toolbar .tool-edit,.manager-excel-toolbar .tool-save,.manager-excel-toolbar .tool-cancel,.manager-excel-toolbar .tool-delete{min-width:82px}.manager-excel-toolbar .tool-save{background:#16803c!important}.manager-excel-toolbar .tool-add{background:#eef5ff}.manager-excel-toolbar .tool-delete{background:#fff5f4}.manager-excel-table td.wide .manager-excel-cell-input{min-width:160px}.manager-excel-table th:last-child,.manager-excel-table td:last-child{border-right:1px solid #dbe3ed}.manager-excel-help{margin-top:0}\n'''
          css.write_text(c,encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/services/productionService.ts frontend/src/pages/manager/ManagerReportGrid.tsx frontend/src/pages/manager/ManagerExcelReports.css
          git commit -m "feat: make manager reports behave like Excel"
          git push
          rm -f .github/workflows/patch-manager-excel-v3.yml
          git add .github/workflows/patch-manager-excel-v3.yml
          git commit -m "chore: remove one-time manager Excel patch"
          git push