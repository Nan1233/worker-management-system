name: Dependency High Vulnerability Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-high-audit-test
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - backend
          - frontend
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - name: Install exact lockfile
        run: npm ci --ignore-scripts
      - name: Fail on High or Critical vulnerabilities
        run: npm audit --audit-level=high
