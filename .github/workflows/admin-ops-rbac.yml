name: Admin Ops RBAC Checks

on:
  pull_request:
    branches: [test]
  push:
    branches: ['safe/admin-ops-**', 'ci/admin-ops-**']
  workflow_dispatch: {}

jobs:
  backend-rbac-tests:
    name: Backend RBAC contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: node --check server.js
      - name: RBAC / permission contract tests (no live DB required)
        run: >
          node --test
          tests/admin-ops-scope.contract.test.js
          tests/authorization-f09-scope.test.js
          tests/authorization-process-scope.test.js
          tests/permission-matrix.test.cjs
          tests/full-authorization-audit.test.cjs

  frontend-rbac-checks:
    name: Frontend typecheck + permissions UI test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Permissions UI contract test
        run: node --test tests/permissions-ui.test.cjs
