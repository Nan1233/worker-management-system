name: Historical Machine Hours Audit Regression

on:
  push:
    branches:
      - fix/audit-separate-worker-line-event-hours
    paths:
      - 'backend/scripts/auditHistoricalMachineHoursRemote.cjs'
      - 'backend/tests/auditHistoricalMachineHoursRemote.test.js'
      - '.github/workflows/historical-machine-hours-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Do not run package lifecycle scripts: this audit suite needs no DB,
      # migrations, credentials, or external service connections.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --check scripts/auditHistoricalMachineHoursRemote.cjs
      - run: node --test --test-reporter=tap tests/auditHistoricalMachineHoursRemote.test.js
