name: Phase 5 Public Health Smoke (read-only)
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Worker to check without authentication or data writes'
        type: choice
        required: true
        options: [test, production]
permissions:
  contents: read
jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate probe implementation
        run: node --test tests/phase5-public-health-smoke.test.cjs
      - name: Check public live and ready endpoints
        run: node scripts/phase5PublicHealthSmoke.cjs ${{ inputs.target }}
