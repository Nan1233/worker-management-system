name: One-time draft resume fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[draft-fix-done]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch draft restore ordering
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/pages/worker/ProcessPage.tsx')
          text = path.read_text(encoding='utf-8')
          marker = 'const isRestoringDraftRef = useRef(false);'

          if marker not in text:
              needle = '    const machineStandardRequestSeqRef = useRef<Record<number, number>>({});\n'
              if needle not in text:
                  raise SystemExit('Could not find machineStandardRequestSeqRef')
              text = text.replace(needle, needle + '    const isRestoringDraftRef = useRef(false);\n', 1)

          old = '''    useEffect(() => {\n        if (!isCutLongProcess) return;\n        setForm((current) => current.productName ? { ...current, productName: "", standardOutput: "" } : current);'''
          new = '''    useEffect(() => {\n        if (isRestoringDraftRef.current) return;\n        if (!isCutLongProcess) return;\n        setForm((current) => current.productName ? { ...current, productName: "", standardOutput: "" } : current);'''
          text = text.replace(old, new, 1)

          old = '''    useEffect(() => {\n        if (!isCutLongProcess && !isInspectionProcess) return;\n        setForm((current) => ({ ...current, productName: "", standardOutput: "", machineNo: "" }));'''
          new = '''    useEffect(() => {\n        if (isRestoringDraftRef.current) return;\n        if (!isCutLongProcess && !isInspectionProcess) return;\n        setForm((current) => ({ ...current, productName: "", standardOutput: "", machineNo: "" }));'''
          text = text.replace(old, new, 1)

          old = '''    useEffect(() => {\n        setExtraData({});\n        setMachineLines([createEmptyMachineLine()]);'''
          new = '''    useEffect(() => {\n        if (isRestoringDraftRef.current) return;\n        setExtraData({});\n        setMachineLines([createEmptyMachineLine()]);'''
          text = text.replace(old, new, 1)

          old = '''useEffect(() => {\n        const draft = loadProcessDraft(process);\n        if (!draft) return;\n\n        setForm((current) => ({'''
          new = '''useEffect(() => {\n        const draft = loadProcessDraft(process);\n        if (!draft) return;\n\n        isRestoringDraftRef.current = true;\n\n        setForm((current) => ({'''
          if old not in text:
              raise SystemExit('Could not find draft restore effect')
          text = text.replace(old, new, 1)

          old = '''        setOperationMode(draft.operationMode);\n        setExtraData(draft.extraData || {});\n    }, [process]);'''
          new = '''        setOperationMode(draft.operationMode);\n        setExtraData(draft.extraData || {});\n\n        window.setTimeout(() => {\n            isRestoringDraftRef.current = false;\n        }, 0);\n    }, [process]);'''
          if old not in text:
              raise SystemExit('Could not find draft restore tail')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/worker/ProcessPage.tsx
          git rm .github/workflows/one-time-draft-resume-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(worker): preserve unfinished report when resuming [draft-fix-done]"
          git push origin main
