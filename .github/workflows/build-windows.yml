name: KTC Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "release-*"

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Install desktop
        run: npm ci --prefix desktop
      - name: Verify frontend and desktop
        shell: cmd
        run: |
          npm --prefix frontend run check
          npm --prefix desktop run check
      - name: Build Windows installers
        run: npm --prefix desktop run dist:win
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem desktop/release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath desktop/release/SHA256SUMS.txt -Append -Encoding ascii
          }
          Get-Content desktop/release/SHA256SUMS.txt
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: KTC-Production-Control
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/release-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag desktop/release/*.exe desktop/release/SHA256SUMS.txt --generate-notes --title "KTC Production Control $tag"
