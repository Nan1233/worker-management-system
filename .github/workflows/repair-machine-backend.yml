name: Repair machine adjustment backend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix worker adjustment layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove all per-machine adjustment UI. Adjustment minutes are already Trừ giờ.
          p = Path('frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'\s*<div><div className="machine-section-title">Chỉnh máy</div>'
              r'.*?value=\{line\.adjustmentMinutes\}.*?'
              r'value=\{line\.adjustmentCount\}.*?</div></div>', re.S)
          s, removed = pattern.subn('\n', s)
          if removed == 0:
              raise SystemExit('No per-machine adjustment blocks found')

          # Recreate exactly one report-level count outside machineLines.map().
          old_count = re.compile(r'\s*<div className="worker-field-block worker-machine-adjustment-count">.*?</div>\s*', re.S)
          s, _ = old_count.subn('\n', s)
          marker = '''                        </div>\n                        <div className="machine-lines-list">'''
          count_ui = '''                        </div>\n                        <div className="worker-field-block worker-machine-adjustment-count">\n                            <label className="worker-field-label" htmlFor="adjustmentCount">Số lần chỉnh máy</label>\n                            <div className="worker-deduction-input-row"><input id="adjustmentCount" className="worker-text-input worker-deduction-input" type="number" min="0" inputMode="numeric" value={form.adjustmentCount || ""} onChange={(event) => setForm((current) => ({ ...current, adjustmentCount: event.target.value.replace(/\\D/g, "") }))} placeholder="0" autoComplete="off" /><span className="worker-time-unit" aria-hidden="true">lần</span></div>\n                        </div>\n                        <div className="machine-lines-list">'''
          if marker not in s:
              raise SystemExit('Machine list marker not found')
          s = s.replace(marker, count_ui, 1)
          p.write_text(s, encoding='utf-8')

          # Never send adjustment fields per machine line.
          p = Path('frontend/src/pages/worker/processReportSubmission.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    adjustment_minutes:num(l.adjustmentMinutes),\n', '')
          s = s.replace('    adjustment_count:num(l.adjustmentCount),\n', '')
          if 'adjustment_count:num(args.form.adjustmentCount)' not in s:
              s = s.replace('    extra_data:args.extraData,', '    extra_data:{...args.extraData, adjustment_count:num(args.form.adjustmentCount)},', 1)
          p.write_text(s, encoding='utf-8')

          # Remove count from generic Trừ giờ if an earlier patch placed it there.
          p = Path('frontend/src/pages/worker/components/ProcessTimeDeductionSection.tsx')
          s = p.read_text(encoding='utf-8')
          generic = re.compile(r'\s*\{selectedDeduction\.includes\("chinhMay"\) && <div className="worker-field-block">.*?</div>\}\s*', re.S)
          s, _ = generic.subn('\n', s)
          p.write_text(s, encoding='utf-8')

          # Restore count in worker edit form.
          p = Path('frontend/src/pages/worker/WorkerReportEdit.tsx')
          s = p.read_text(encoding='utf-8')
          if 'adjustmentCount: String((data.extra_data || {}).adjustment_count' not in s:
              anchor = '          note: String(data.note || ""),'
              if anchor not in s:
                  raise SystemExit('WorkerReportEdit anchor not found')
              s = s.replace(anchor, anchor + '\n          adjustmentCount: String((data.extra_data || {}).adjustment_count ?? ""),', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          test "$(grep -o 'id=\"adjustmentCount\"' frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx | wc -l)" -eq 1
          ! grep -q 'value={line.adjustmentMinutes}' frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx
          ! grep -q 'value={line.adjustmentCount}' frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx
          ! grep -q 'adjustment_minutes:num(l.adjustmentMinutes)' frontend/src/pages/worker/processReportSubmission.ts
          ! grep -q 'adjustment_count:num(l.adjustmentCount)' frontend/src/pages/worker/processReportSubmission.ts
          grep -q 'adjustment_count:num(args.form.adjustmentCount)' frontend/src/pages/worker/processReportSubmission.ts
      - name: Commit and remove helper files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx frontend/src/pages/worker/components/ProcessTimeDeductionSection.tsx frontend/src/pages/worker/processReportSubmission.ts frontend/src/pages/worker/WorkerReportEdit.tsx
          git rm .github/workflows/repair-machine-backend.yml .github/workflows/fix-adjustment-count.yml .github/ADJUSTMENT_FIX_TRIGGER || true
          git commit -m 'fix(worker): keep adjustment count separate from machine rows [skip ci]'
          git push