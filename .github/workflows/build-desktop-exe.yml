name: Build KTC Desktop Setup

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Setup
        run: npm run dist:setup:fast

      - name: Upload Setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: KTC-Desktop-Setup-test
          path: desktop/release/KTC-Production-Control-Setup.exe
          if-no-files-found: error
          retention-days: 14
