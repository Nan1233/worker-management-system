name: one-time patch approved reports
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch week quick filter
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/pages/manager/ApprovedReports.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''    const selectMonth = () => { setDateRange(rangeFor(date, "month")); };
    const selectYear = () => { setDateRange(rangeFor(date, "year")); };'''
          new = '''    const selectMonth = () => { setDateRange(rangeFor(date, "month")); };
    const selectWeek = () => { setDateRange(rangeFor(date, "week")); };
    const selectYear = () => { setDateRange(rangeFor(date, "year")); };'''
          if old not in s:
              raise SystemExit('selectMonth/selectYear block not found')
          s = s.replace(old, new, 1)
          old = '''<div className="pending-quick-filters"><span>Chọn nhanh</span><button type="button" className={!dateRange ? "active" : ""} onClick={selectDay}>Hôm nay</button><button type="button" className={dateRange?.dateFrom === rangeFor(date, "month").dateFrom && dateRange?.dateTo === rangeFor(date, "month").dateTo ? "active" : ""} onClick={selectMonth}>Cả tháng</button><button type="button" className={dateRange?.dateFrom === rangeFor(date, "year").dateFrom && dateRange?.dateTo === rangeFor(date, "year").dateTo ? "active" : ""} onClick={selectYear}>Cả năm</button></div>'''
          new = '''<div className="pending-quick-filters"><span>Chọn nhanh</span><button type="button" className={!dateRange ? "active" : ""} onClick={selectDay}>Hôm nay</button><button type="button" className={dateRange?.dateFrom === rangeFor(date, "week").dateFrom && dateRange?.dateTo === rangeFor(date, "week").dateTo ? "active" : ""} onClick={selectWeek}>Tuần này</button><button type="button" className={dateRange?.dateFrom === rangeFor(date, "month").dateFrom && dateRange?.dateTo === rangeFor(date, "month").dateTo ? "active" : ""} onClick={selectMonth}>Cả tháng</button><button type="button" className={dateRange?.dateFrom === rangeFor(date, "year").dateFrom && dateRange?.dateTo === rangeFor(date, "year").dateTo ? "active" : ""} onClick={selectYear}>Cả năm</button></div>'''
          if old not in s:
              raise SystemExit('quick filter block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-approved-week.yml
          git add frontend/src/pages/manager/ApprovedReports.tsx .github/workflows/patch-approved-week.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(manager): add week quick filter to approved reports"
          git push
