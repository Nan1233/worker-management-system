name: Fix approved reports UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch approved reports KPI resolver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/manager/ApprovedReports.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''const kpi = (r: ProductionReport) => {
    const x = r as ProductionReport & Record<string, unknown>;
    const ok = num(x.tt_ok); const ng = num(x.tt_ng);
    const actual = num(x.actual_output) || ok + ng;
    const standard = num(x.standard_output) || num(x.target_output);
    const actualTime = num(x.actual_time);
    const ttDinhMuc = num(x.tt_dinh_muc) || (standard > 0 && actualTime > 0 ? standard * actualTime : 0);
    const nangSuat = num(x.nang_suat_percent) || (ttDinhMuc > 0 ? actual / ttDinhMuc * 100 : 0);
    const dat = actual > 0 ? ok / actual * 100 : 0;
    const pp = num(x.pp_percent) || (actual > 0 ? ng / actual * 100 : 0);
    const hv = x.training_percent ?? x.hv_percent ?? x.learning_percent ?? x.hoc_viec_percent ?? 0;
    return { ok, ng, actual, ttDinhMuc, nangSuat, dat, pp, hv };
};'''
          new = '''const kpi = (r: ProductionReport) => {
    const x = r as ProductionReport & Record<string, unknown>;
    const ok = num(x.tt_ok);
    const ng = num(x.tt_ng);

    // Approved-report API có thể không trả actual_output ở list endpoint.
    // Khi đó tổng TT phải được dựng lại từ OK + NG, không được rơi về 0.
    const actualFromDb = num(x.actual_output);
    const actual = actualFromDb > 0 ? actualFromDb : ok + ng;

    // standard_output là định mức SP/giờ; định mức của dòng = SP/giờ × giờ thực tế.
    const standardPerHour = num(x.standard_output) || num(x.target_output);
    const actualTime = num(x.actual_time) || num(x.total_time);
    const ttDinhMucDb = num(x.tt_dinh_muc);
    const ttDinhMuc = ttDinhMucDb > 0
        ? ttDinhMucDb
        : (standardPerHour > 0 && actualTime > 0 ? standardPerHour * actualTime : 0);

    const nangSuatDb = num(x.nang_suat_percent);
    const nangSuat = nangSuatDb > 0
        ? nangSuatDb
        : (ttDinhMuc > 0 ? actual / ttDinhMuc * 100 : 0);

    // % đạt = OK / TT × 100. Không lấy trực tiếp actual_output nếu field đó bị thiếu.
    const datDb = num(x.dat_percent);
    const dat = datDb > 0
        ? datDb
        : (actual > 0 ? ok / actual * 100 : 0);

    const ppDb = num(x.pp_percent);
    const pp = ppDb > 0
        ? ppDb
        : (actual > 0 ? ng / actual * 100 : 0);

    const hv = x.training_percent ?? x.training_percent_snapshot ?? x.hv_percent ?? x.learning_percent ?? x.hoc_viec_percent ?? 0;
    return { ok, ng, actual, ttDinhMuc, nangSuat, dat, pp, hv };
};'''
          if old not in s:
              raise SystemExit('ApprovedReports KPI block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Fix approved reports table widths
        run: |
          cat >> frontend/src/pages/manager/ReportsSplitReference.css <<'CSS'

          /* FINAL APPROVED REPORTS TABLE FIX
             The table contains 14 source columns but column 2 is hidden.
             Give every visible column an explicit width so Chromium does not
             squeeze the KPI columns into unreadable slivers. */
          .pending-reference-page .pending-list-card .pending-table-wrap {
            width: 100%;
            overflow-x: auto !important;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
          }
          .pending-reference-page .pending-list-card .pending-reference-table {
            width: max-content !important;
            min-width: 1450px !important;
            table-layout: fixed !important;
          }
          .pending-reference-page .pending-list-card .pending-reference-table th,
          .pending-reference-page .pending-list-card .pending-reference-table td {
            box-sizing: border-box;
            padding: 10px 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
          }
          .pending-reference-page .pending-list-card .pending-reference-table th:nth-child(1),
          .pending-reference-page .pending-list-card .pending-reference-table td:nth-child(1) { width: 64px; min-width: 64px; }
          .pending-reference-page .pending-list-card .pending-reference-table th:nth-child(2),
          .pending-reference-page .pending-list-card .pending-reference-table td:nth-child(2) { display: none; }
          .pending-reference-page .pending-list-card .pending-reference-table th:nth-child(3),
          .pending-reference-page .pending-list-card .pending-reference-table td:nth-child(3) { width: 190px; min-width: 190px; }
          .pending-reference-page .pending-list-card .pending-reference-table th:nth-child(4),
          .pending-reference-page .pending-list-card .pending-reference-table td:nth-child(4) { width: 155px; min-width: 155px; }
          .pending-reference-page .pending-list-card .pending-reference-table th:nth-child(5),
          .pending-reference-page .pending-list-card .pending-reference-table td:nth-child(5) { width: 75px; min-width: 75px; }
          .pending-reference-page .pending-list-card .pending-reference-table th:nth-child(6),
          .pending-reference-page .pending-list-card .pending-reference-table td:nth-child(6) { width: 105px; min-width: 105px; }
          .pending-reference-page .pending-list-card .pending-reference-table th:nth-child(7),
          .pending-reference-page .pending-list-card .pending-reference-table td:nth-child(7) { width: 105px; min-width: 105px; }
          .pending-reference-page .pending-list-card .pending-reference-table th:nth-child(8),
          .pending-reference-page .pending-list-card .pending-reference-table td:nth-child(8) { width: 90px; min-width: 90px; }
          .pending-reference-page .pending-list-card .pending-reference-table th:nth-child(9),
          .pending-reference-page .pending-list-card .pending-reference-table td:nth-child(9) { width: 90px; min-width: 90px; }
          .pending-reference-page .pending-list-card .pending-reference-table th:nth-child(10),
          .pending-reference-page .pending-list-card .pending-reference-table td:nth-child(10) { width: 85px; min-width: 85px; }
          .pending-reference-page .pending-list-card .pending-reference-table th:nth-child(11),
          .pending-reference-page .pending-list-card .pending-reference-table td:nth-child(11) { width: 115px; min-width: 115px; }
          .pending-reference-page .pending-list-card .pending-reference-table th:nth-child(12),
          .pending-reference-page .pending-list-card .pending-reference-table td:nth-child(12) { width: 100px; min-width: 100px; }
          .pending-reference-page .pending-list-card .pending-reference-table th:nth-child(13),
          .pending-reference-page .pending-list-card .pending-reference-table td:nth-child(13) { width: 95px; min-width: 95px; }
          .pending-reference-page .pending-list-card .pending-reference-table th:nth-child(14),
          .pending-reference-page .pending-list-card .pending-reference-table td:nth-child(14) { width: 110px; min-width: 110px; }

          @media (max-width: 720px) {
            .pending-reference-page .pending-list-card .pending-reference-table {
              min-width: 1380px !important;
            }
            .pending-reference-page .pending-list-card .pending-reference-table th,
            .pending-reference-page .pending-list-card .pending-reference-table td {
              padding: 9px 10px;
            }
          }
          CSS

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/manager/ApprovedReports.tsx frontend/src/pages/manager/ReportsSplitReference.css
          git commit -m "fix: repair approved reports KPI display and column sizing"
          rm -f .github/workflows/fix-approved-reports-ui.yml
          git add .github/workflows/fix-approved-reports-ui.yml
          git commit -m "chore: remove temporary approved reports UI workflow"
          git push origin HEAD:main
