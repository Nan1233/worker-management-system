name: Desktop Dependency Remediation (PR branch only)
on:
  push:
    branches: [ci/phase3-evidence-bundle]
    paths:
      - '.github/workflows/desktop-security-remediation.yml'
      - 'desktop/package.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remediate:
    if: github.repository == 'Nan1233/worker-management-system' && github.ref == 'refs/heads/ci/phase3-evidence-bundle'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install and propose compatible dependency fixes
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm audit fix --package-lock-only --omit=dev --no-audit --no-fund
      - name: Verify lockfile and all desktop acceptance tests
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run smoke:excel
          node --test tests/phase2-gc-xlsx-roundtrip.test.cjs tests/monthly-workbook-physical-events.test.cjs tests/company-excel-shared-machine.test.cjs tests/production-calculation-engine.test.cjs
          npm audit --omit=dev --audit-level=high
      - name: Commit verified lockfile only to PR branch
        run: |
          if git diff --quiet -- desktop/package-lock.json; then
            echo 'No remediation changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- desktop/package-lock.json
          git commit -m 'fix(desktop): resolve high severity npm audit findings'
          git push origin HEAD:ci/phase3-evidence-bundle
