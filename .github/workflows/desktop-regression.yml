name: Desktop Regression Validation

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'shared/**'
      - 'backend/templates/**'
      - '.github/workflows/desktop-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-regression:
    name: Desktop static and Excel regression
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax, security and packaging checks
        run: npm run check
      - name: Excel regression suite
        run: npm run smoke:excel
      - name: Portable update safety
        run: npm run test:portable-upgrade
      - name: Startup regression
        run: npm run test:startup-performance && npm run test:startup-crash
