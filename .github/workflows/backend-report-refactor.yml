name: Backend report refactor checks

on:
  push:
    branches: [test]
    paths:
      - 'backend/controllers/productionTempWorkerController.js'
      - 'backend/controllers/productionTempControllerUtils.js'
      - 'backend/services/productionTempReportPayloadService.js'
      - 'backend/services/logicalDuplicateReportService.js'
      - 'backend/tests/productionTempReportPayloadService.test.js'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'shared/productionOutput.cjs'
      - '.github/workflows/backend-report-refactor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check backend source syntax
        run: npm run check
      - name: Run report payload unit tests
        run: node --test tests/productionTempReportPayloadService.test.js
