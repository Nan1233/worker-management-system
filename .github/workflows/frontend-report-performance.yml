name: Frontend report performance regression

on:
  push:
    branches: [test]
    paths:
      - 'frontend/src/pages/manager/ApprovedReports.tsx'
      - 'frontend/tests/approved-kpi-pagination-performance.contract.test.cjs'
      - '.github/workflows/frontend-report-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: KPI pagination request contract
        run: node --test tests/approved-kpi-pagination-performance.contract.test.cjs tests/manager-server-pagination.test.cjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production bundle build
        run: npm run build
