name: Staging Release Gate Safety
on:
  pull_request:
    branches: [test]
    paths:
      - 'scripts/stagingReleaseGate.cjs'
      - 'scripts/stagingE2E.cjs'
      - 'scripts/zero-cost/critical-e2e.cjs'
      - 'scripts/zero-cost/http.cjs'
      - 'backend/scripts/e2e-db-guard.cjs'
      - 'tests/staging-release-gate-guard.test.cjs'
      - 'tests/staging-e2e-api-target.test.cjs'
      - 'tests/critical-e2e-direct-guard.test.cjs'
      - 'tests/critical-e2e-cleanup-contract.test.cjs'
      - 'tests/critical-e2e-finally-cleanup.test.cjs'
      - 'tests/critical-e2e-db-tls.test.cjs'
      - 'tests/e2e-db-port-and-run-id.test.cjs'
      - 'tests/critical-e2e-writer-session.test.cjs'
      - 'tests/critical-e2e-cleanup-like.test.cjs'
      - 'tests/zero-cost-http-redirect.test.cjs'
      - '.github/workflows/staging-release-gate-safety.yml'
  push:
    branches: [test]
    paths:
      - 'scripts/stagingReleaseGate.cjs'
      - 'scripts/stagingE2E.cjs'
      - 'scripts/zero-cost/critical-e2e.cjs'
      - 'scripts/zero-cost/http.cjs'
      - 'backend/scripts/e2e-db-guard.cjs'
      - 'tests/staging-release-gate-guard.test.cjs'
      - 'tests/staging-e2e-api-target.test.cjs'
      - 'tests/critical-e2e-direct-guard.test.cjs'
      - 'tests/critical-e2e-cleanup-contract.test.cjs'
      - 'tests/critical-e2e-finally-cleanup.test.cjs'
      - 'tests/critical-e2e-db-tls.test.cjs'
      - 'tests/e2e-db-port-and-run-id.test.cjs'
      - 'tests/critical-e2e-writer-session.test.cjs'
      - 'tests/critical-e2e-cleanup-like.test.cjs'
      - 'tests/zero-cost-http-redirect.test.cjs'
      - '.github/workflows/staging-release-gate-safety.yml'
permissions:
  contents: read
jobs:
  safety-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix backend --no-audit --no-fund
      - run: node --check scripts/stagingReleaseGate.cjs
      - run: node --check scripts/stagingE2E.cjs
      - run: node --check scripts/zero-cost/critical-e2e.cjs
      - run: node --test tests/staging-release-gate-guard.test.cjs tests/staging-e2e-api-target.test.cjs tests/critical-e2e-direct-guard.test.cjs tests/critical-e2e-cleanup-contract.test.cjs tests/critical-e2e-finally-cleanup.test.cjs tests/critical-e2e-db-tls.test.cjs tests/e2e-db-port-and-run-id.test.cjs tests/critical-e2e-writer-session.test.cjs tests/critical-e2e-cleanup-like.test.cjs tests/zero-cost-http-redirect.test.cjs
