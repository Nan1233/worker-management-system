name: Fix CVK report edit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-cvk-edit.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch CVK edit handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/pages/worker/processPageDomain.ts')
          s = p.read_text()
          old = '    "sx3": "SX3",\n  };'
          new = '    "sx3": "SX3",\n    "cvk": "CVK",\n  };'
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('isManualOnlyProcess: ["XLBV", "SX3"].includes(processCode),', 'isManualOnlyProcess: ["XLBV", "SX3", "CVK"].includes(processCode),', 1)
          p.write_text(s)

          p = Path('frontend/src/pages/worker/WorkerReportEdit.tsx')
          s = p.read_text()
          s = s.replace('const processSlug = (code?: string | null) => ({ GC: "cat-long", MAI: "mai", DO: "do", K1: "kiem-1", K2: "kiem-2", CAN: "can", EP: "ep", XLBV: "bavia", SX3: "sx3" } as Record<string, string>)[String(code || "").trim().toUpperCase()] || "cat-long";', 'const processSlug = (code?: string | null) => ({ GC: "cat-long", MAI: "mai", DO: "do", K1: "kiem-1", K2: "kiem-2", CAN: "can", EP: "ep", XLBV: "bavia", SX3: "sx3", CVK: "cvk" } as Record<string, string>)[String(code || "").trim().toUpperCase()] || "cat-long";', 1)
          s = s.replace('  const [remaining, setRemaining] = useState(0);', '  const [remaining, setRemaining] = useState(0);\n  const [workType, setWorkType] = useState("Công việc khác");', 1)
          s = s.replace('        setReport(data);\n        const actual =', '        const normalizedProcessCode = String(data.process_code || data.extra_data?.process_code || "").trim().toUpperCase();\n        const normalizedProcessId = Number(data.process_id) > 0 ? Number(data.process_id) : (normalizedProcessCode === "CVK" ? 60006 : 0);\n        const normalizedData = { ...data, process_id: normalizedProcessId, process_code: normalizedProcessCode || data.process_code };\n        setReport(normalizedData);\n        setWorkType(String(data.extra_data?.work_type || data.work_type || "Công việc khác"));\n        const actual =', 1)
          s = s.replace('  const process = processSlug(report?.process_code);\n  const capabilities', '  const process = processSlug(report?.process_code);\n  const resolvedProcessId = Number(report?.process_id) > 0 ? Number(report?.process_id) : (String(report?.process_code || "").toUpperCase() === "CVK" ? 60006 : 0);\n  const isCVK = String(report?.process_code || "").toUpperCase() === "CVK" || resolvedProcessId === 60006;\n  const capabilities', 1)
          s = s.replace('useProcessMasterData(report?.process_id || 0, capabilities.processCode)', 'useProcessMasterData(resolvedProcessId, capabilities.processCode)', 1)
          s = s.replace('        setExtraData(Object.fromEntries(Object.entries(data.extra_data || {}).filter(([key]) => key !== "adjustment_count").map(([key, value]) => [key, value == null ? "" : String(value)])));', '        setExtraData(Object.fromEntries(Object.entries(data.extra_data || {}).filter(([key]) => key !== "adjustment_count" && key !== "work_type").map(([key, value]) => [key, value == null ? "" : String(value)])));', 1)
          s = s.replace('    const payload = buildProductionReportPayload({', '    if (isCVK) {\n      const deductionPayload = selectedDeduction.map((key) => {\n        const option: any = activeDeductionOptions.find((item: any) => item.key === key);\n        const minutes = Number(deductions[key] || 0);\n        return option && minutes > 0 ? { deduction_type_id: option.id ?? option.deduction_type_id, deduction_code: option.code ?? option.deduction_code, deduction_name: option.label ?? option.deduction_name, hours: minutes / 60 } : null;\n      }).filter(Boolean);\n      const actual = number(form.actualHours) + number(form.actualMinutes) / 60;\n      const deduction = deductionPayload.reduce((sum: number, item: any) => sum + Number(item.hours || 0), 0);\n      const cvkPayload: any = { ...report, process_id: 60006, process_code: "CVK", work_date: form.workDate, shift: form.shift, machine_no: null, product_name: null, operation_mode: "MANUAL", total_time: actual + deduction, actual_time: actual, deduction_time: deduction, standard_output: 0, actual_output: 0, tt_ok: 0, tt_ng: 0, note: form.note, defects: [], deductions: deductionPayload, extra_data: { ...extraData, process_code: "CVK", non_product_work: true, work_type: workType }, expected_updated_at: report.updated_at, updated_at: report.updated_at };\n      try { setSaving(true); await updateTempReport(Number(report.id), cvkPayload); navigate(`/worker/history/${report.id}`, { replace: true }); } catch (e: any) { setError(e?.response?.data?.message || e?.message || "Không thể lưu thay đổi."); } finally { setSaving(false); }\n      return;\n    }\n    const payload = buildProductionReportPayload({', 1)
          s = s.replace('    {operationMode === "MANUAL" && <section className="detail-section"><h2>Sản phẩm & sản lượng</h2>', '    {isCVK && <section className="detail-section"><h2>Thông tin công việc</h2><div className="detail-grid"><label><span>Loại công việc</span><select value={workType} onChange={(e) => setWorkType(e.target.value)}><option>Xuất nhập</option><option>Hỗ trợ</option><option>Kho</option><option>Vệ sinh</option><option>Công việc khác</option></select></label><label><span>Công đoạn</span><input value="Công việc khác (CVK)" disabled /></label></div></section>}\n\n    {!isCVK && operationMode === "MANUAL" && <section className="detail-section"><h2>Sản phẩm & sản lượng</h2>', 1)
          s = s.replace('    {operationMode === "MACHINE" && <section className="detail-section"><div', '    {!isCVK && operationMode === "MACHINE" && <section className="detail-section"><div', 1)
          s = s.replace('    <section className="detail-section"><h2>Lỗi NG</h2>', '    {!isCVK && <section className="detail-section"><h2>Lỗi NG</h2>', 1)
          s = s.replace('    <section className="detail-section"><h2>Trừ giờ</h2><div', '    <section className="detail-section"><h2>Trừ giờ</h2><div', 1)
          # close the NG conditional immediately after its section
          marker = '<div className="detail-grid">{ngFields.map((option: any) => <label key={option.key}><span>{option.label || option.defect_name || option.code}</span><input type="number" min="0" value={form[option.key] || ""} onChange={(e) => updateForm(option.key, e.target.value)} /></label>)}</div></section>'
          assert marker in s
          s = s.replace(marker, marker + '}', 1)
          p.write_text(s)
          PY
      - name: TypeScript check
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npx tsc --noEmit
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/worker/processPageDomain.ts frontend/src/pages/worker/WorkerReportEdit.tsx
          git commit -m 'fix(worker): repair CVK report edit flow [skip ci]' || exit 0
          git push origin HEAD:main
          git rm .github/workflows/fix-cvk-edit.yml
          git commit -m 'chore: remove one-time CVK edit workflow [skip ci]'
          git push origin HEAD:main
