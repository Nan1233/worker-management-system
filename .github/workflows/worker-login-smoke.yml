name: Worker login smoke (isolated test DB)

on:
  push:
    branches:
      - worker-login-smoke-test
  pull_request:
    branches:
      - test
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/worker-login-smoke.yml'

permissions:
  contents: read

jobs:
  worker-login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      KTC_IT_DB_HOST: 127.0.0.1
      KTC_IT_DB_PORT: '3306'
      KTC_IT_DB_USER: root
      KTC_IT_DB_PASSWORD: root
      KTC_IT_DB_NAME: ktc_it_worker_login_ci
      KTC_E2E_API_PORT: '19080'
      KTC_PLAYWRIGHT_START_SERVER: '1'
      KTC_FRONTEND_URL: http://127.0.0.1:5173
      JWT_SECRET: integration-test-secret-integration-test-secret
      CI: 'true'

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Worker login browser smoke test
        working-directory: frontend
        run: npx playwright test tests/e2e/worker-login-smoke.spec.ts --project=chromium-desktop

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-login-playwright-diagnostics
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
