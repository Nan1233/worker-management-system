name: Phase 3 Source Acceptance Evidence
on:
  pull_request:
    branches: [test]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'desktop/**'
      - 'shared/**'
      - '.github/workflows/phase3-source-acceptance.yml'
  push:
    branches: [test]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'desktop/**'
      - 'shared/**'
      - '.github/workflows/phase3-source-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run smoke:excel
      - run: node --test tests/phase2-gc-xlsx-roundtrip.test.cjs tests/monthly-workbook-physical-events.test.cjs tests/company-excel-shared-machine.test.cjs tests/production-calculation-engine.test.cjs
      - run: npm audit --omit=dev --audit-level=high
  source-acceptance:
    needs: [backend, frontend, desktop]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Phase 3 source checks passed for commit ${GITHUB_SHA}. This is NOT staging UAT or production approval."
