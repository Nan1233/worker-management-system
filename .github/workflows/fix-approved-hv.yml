name: Fix approved report training percent

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch approved report list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/models/productionTempReadModel.js')
          s = p.read_text(encoding='utf-8')
          old = '''            query(db, `SELECT pr.id, pr.work_date, pr.shift, pr.machine_no, pr.product_name,\n                        w.worker_code, u.full_name, p.process_name\n                 FROM production_reports pr'''
          new = '''            query(db, `SELECT pr.id, pr.work_date, pr.shift, pr.machine_no, pr.product_name,\n                        pr.training_percent_snapshot AS training_percent,\n                        w.worker_code, u.full_name, p.process_name\n                 FROM production_reports pr'''
          if old not in s:
              raise SystemExit('approved report SELECT block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/models/productionTempReadModel.js
          git commit -m "fix: include training snapshot in approved report list"
          git push origin HEAD:main

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-approved-hv.yml
          git commit -m "chore: remove temporary approved HV workflow"
          git push origin HEAD:main
