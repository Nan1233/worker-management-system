name: Phase 5 Release Readiness (Source Only)

on:
  push:
    branches: [test]
    paths:
      - 'scripts/phase5ReleaseReadiness.cjs'
      - 'tests/phase5-release-readiness.test.cjs'
      - 'render.yaml'
      - 'frontend/render.yaml'
      - 'backend/render.yaml'
      - 'backend/server.js'
      - 'desktop/electron/launcher.cjs'
      - 'desktop/electron/autoUpdate.cjs'
      - 'desktop/package.json'
      - 'backend/package.json'
      - 'frontend/package.json'
      - 'package.json'
      - 'docs/PHASE5_RELEASE_READINESS.md'
      - '.github/workflows/phase5-release-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-only readiness report
        run: node scripts/phase5ReleaseReadiness.cjs
      - name: Verify release gate fails closed for unresolved TEST configuration
        run: node --test tests/phase5-release-readiness.test.cjs
