name: Phase 5 Release Readiness (Source Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-only readiness report
        run: node scripts/phase5ReleaseReadiness.cjs
      - name: Run Cloudflare profile contract tests (no database access)
        run: node --test backend/tests/cloudflare-deployment-profile.test.js desktop/tests/deployment-profile.test.cjs
      - name: Verify release gate fails closed until runtime secrets are verified
        run: node --test tests/phase5-release-readiness.test.cjs tests/jsonc-helper.test.cjs
