name: Remove Long Air Option

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove Air option from Lồng
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('type LongExecutionMode = "MANUAL" | "MACHINE" | "AIR";', 'type LongExecutionMode = "MANUAL" | "MACHINE";')
          s = s.replace('''                                    <button type="button" className={longExecutionMode === "AIR" ? "active" : ""} onClick={() => handleLongExecutionModeChange("AIR")}>Khí</button>\n''', '')
          p.write_text(s, encoding='utf-8')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx
          git commit -m 'fix(worker): remove long air option'
          git push origin main
