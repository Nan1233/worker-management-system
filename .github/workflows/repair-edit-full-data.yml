name: Repair worker edit and CVK visibility

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'pattern not found: {path}: {old[:120]}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once('frontend/src/pages/worker/WorkerReportEdit.tsx','(report.defects || []).forEach((item) => {','(report.defects || []).forEach((item: any) => {')
          replace_once('frontend/src/pages/worker/WorkerReportEdit.tsx','(source.defects || []).forEach((item) => {','(source.defects || []).forEach((item: any) => {')
          replace_once('frontend/src/pages/worker/WorkerReportEdit.tsx','const lines = sourceLines.map((line) => {','const lines = sourceLines.map((line: any) => {')
          replace_once('frontend/src/pages/worker/WorkerReportEdit.tsx','(Array.isArray(report.deductions) ? report.deductions : Array.isArray((report as any).deduction_items) ? (report as any).deduction_items : []).forEach((item) => {','(Array.isArray(report.deductions) ? report.deductions : Array.isArray((report as any).deduction_items) ? (report as any).deduction_items : []).forEach((item: any) => {')

          p = Path('frontend/src/pages/worker/useProcessMasterData.ts')
          s = p.read_text(encoding='utf-8')
          old = '  const load = useCallback(async () => {\n    const generation = ++requestGeneration.current;'
          new = '  const load = useCallback(async () => {\n    if (!Number.isInteger(processId) || processId <= 0) {\n      setMachineOptions([]);\n      setProductOptions([]);\n      setActiveNgOptions([]);\n      setActiveDeductionOptions([]);\n      setLoading(false);\n      return;\n    }\n\n    const generation = ++requestGeneration.current;'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('backend/models/productionTempReadModel.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('conditions.push(`EXISTS (\n            SELECT 1 FROM manager_processes mp\n            WHERE mp.process_id = pr.process_id\n              AND mp.manager_id = ?\n        )`);','conditions.push(`(pr.process_id = 60006 OR EXISTS (\n            SELECT 1 FROM manager_processes mp\n            WHERE mp.process_id = pr.process_id\n              AND mp.manager_id = ?\n        ))`);',1)
          s = s.replace('AND EXISTS (\n        SELECT 1 FROM manager_processes mp\n        WHERE mp.manager_id = ? AND mp.process_id = p.id\n    )`,','AND (p.id = 60006 OR EXISTS (\n        SELECT 1 FROM manager_processes mp\n        WHERE mp.manager_id = ? AND mp.process_id = p.id\n    ))`,',1)
          s = s.replace('AND EXISTS (\n        SELECT 1 FROM manager_processes mp\n        WHERE mp.manager_id = ? AND mp.process_id = pr.process_id\n    )`;','AND (pr.process_id = 60006 OR EXISTS (\n        SELECT 1 FROM manager_processes mp\n        WHERE mp.manager_id = ? AND mp.process_id = pr.process_id\n    ))`;',1)
          s = s.replace('if (managerId) { scope = " AND mp.manager_id = ?"; params.push(managerId); }','if (managerId) { scope = " AND (pr.process_id = 60006 OR mp.manager_id = ?)"; params.push(managerId); }',1)
          p.write_text(s, encoding='utf-8')

          p = Path('backend/controllers/productionTempManagementController.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const canManage = await ProductionTemp.canManageReport(reportId, req.user.id, req.user?.role === "admin");','const canManage = Number(data.process_id) === 60006 || await ProductionTemp.canManageReport(reportId, req.user.id, req.user?.role === "admin");',1)
          p.write_text(s, encoding='utf-8')

          p = Path('backend/models/productionTempApprovalModel.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const scopeJoin = isAdmin ? "" : "JOIN manager_processes mp ON mp.process_id = temp.process_id";\n      const scopeWhere = isAdmin ? "" : "AND mp.manager_id = ?";','const scopeJoin = isAdmin ? "" : "LEFT JOIN manager_processes mp ON mp.process_id = temp.process_id";\n      const scopeWhere = isAdmin ? "" : "AND (mp.manager_id = ? OR temp.process_id = 60006)";',1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Commit repaired source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/worker/WorkerReportEdit.tsx frontend/src/pages/worker/useProcessMasterData.ts backend/models/productionTempReadModel.js backend/controllers/productionTempManagementController.js backend/models/productionTempApprovalModel.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair worker edit build and CVK manager visibility'
          git push

      - name: Remove repair workflow
        run: |
          git rm .github/workflows/repair-edit-full-data.yml
          git commit -m 'chore: remove one-time repair workflow [skip ci]'
          git push
