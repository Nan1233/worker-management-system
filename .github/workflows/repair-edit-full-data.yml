name: Repair edit full data

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair backend detail and frontend edit loading
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Return process_code with temp report detail so edit mode uses the
          # exact same process configuration as the original report.
          p = Path('backend/models/productionTempReadModel.js')
          s = p.read_text(encoding='utf-8')
          old = 'SELECT pr.*, w.worker_code, u.full_name, p.process_name,\n                    reviewer.full_name AS reviewer_name'
          new = 'SELECT pr.*, w.worker_code, u.full_name, p.process_name, p.process_code AS process_code,\n                    reviewer.full_name AS reviewer_name'
          if old in s and 'p.process_code AS process_code' not in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 2) Always fetch the edit report fresh. A cached GET must never make
          # the edit form look empty/stale after the detail page has fresh data.
          p = Path('frontend/src/services/productionService.ts')
          s = p.read_text(encoding='utf-8')
          old = 'export const getReportById=async(id:number,source?:string|null)=>{const normalizedSource=String(source||"").toLowerCase();const url=normalizedSource==="pending"||normalizedSource==="temp"?`/production-temp/${id}`:`/production/${id}`;const res=await api.get(url);return res.data.data||res.data;};'
          new = 'export const getReportById=async(id:number,source?:string|null)=>{const normalizedSource=String(source||"").toLowerCase();const url=normalizedSource==="pending"||normalizedSource==="temp"?`/production-temp/${id}`:`/production/${id}`;const res=await api.get(url,{params:{_t:Date.now()},headers:{"Cache-Control":"no-cache","Pragma":"no-cache"}});return res.data.data||res.data;};'
          if old not in s:
              raise SystemExit('getReportById pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Restore machine/defect/deduction state immediately from every
          # supported response shape, not only after master data finishes.
          p = Path('frontend/src/pages/worker/WorkerReportEdit.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'setOperationType(data.operation_type === "LONG" ? "LONG" : "CUT");\n        setOperationMode(data.operation_mode === "MACHINE" || (data.machine_lines || []).length > 0 ? "MACHINE" : "MANUAL");\n        setExtraData(Object.fromEntries(Object.entries(data.extra_data || {}).map(([key, value]) => [key, value == null ? "" : String(value)])));'
          new = '''const loadedMachineLines = Array.isArray(data.machine_lines) ? data.machine_lines : Array.isArray(data.machineLines) ? data.machineLines : Array.isArray(data.machines) ? data.machines : [];
        const loadedDefects = Array.isArray(data.defects) ? data.defects : Array.isArray(data.ng_defects) ? data.ng_defects : [];
        const loadedDeductions = Array.isArray(data.deductions) ? data.deductions : Array.isArray(data.deduction_items) ? data.deduction_items : [];
        setOperationType(data.operation_type === "LONG" ? "LONG" : "CUT");
        setOperationMode(data.operation_mode === "MACHINE" || loadedMachineLines.length > 0 || String(data.machine_no || "").trim() !== "" ? "MACHINE" : "MANUAL");
        setMachineLines(loadedMachineLines.length ? loadedMachineLines.map((line) => {
          const hm = toHoursMinutes(number(line.machine_time_hours ?? line.machineTimeHours ?? ((Number(line.running_hours || 0) * 60 + Number(line.running_minutes || 0)) / 60)));
          return { ...createEmptyMachineLine(), machineCode: String(line.machine_code ?? line.machineCode ?? ""), productCode: String(line.product_code ?? line.productCode ?? ""), hours: hm.hours, minutes: hm.minutes, okQuantity: String(line.ok_quantity ?? line.okQuantity ?? ""), ngQuantity: String(line.ng_quantity ?? line.ngQuantity ?? ""), adjustmentMinutes: "", adjustmentCount: "", standardOutputPerHour: Number(line.standard_output || 0), standardTimeSeconds: line.standard_time_seconds ?? null, standardSource: line.standard_source || null };
        }) : [createEmptyMachineLine()]);
        setExtraData(Object.fromEntries(Object.entries(data.extra_data || {}).map(([key, value]) => [key, value == null ? "" : String(value)])));
        if (loadedDefects.length) setSelectedNg(loadedDefects.map((item) => String(item.defect_code || item.code || item.defect_name || "")).filter(Boolean));
        if (loadedDeductions.length) setSelectedDeduction(loadedDeductions.map((item) => String(item.deduction_code || item.code || item.deduction_name || "")).filter(Boolean));'''
          if old not in s:
              raise SystemExit('WorkerReportEdit load pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/models/productionTempReadModel.js frontend/src/services/productionService.ts frontend/src/pages/worker/WorkerReportEdit.tsx
          git commit -m 'fix(worker): restore full report details in edit form [skip ci]'
          git push

      - name: Remove helper workflow
        run: |
          git rm .github/workflows/repair-edit-full-data.yml
          git commit -m 'chore: remove edit data repair helper [skip ci]'
          git push
