name: F01 Electron Auth Checks
run-name: F01 Electron Auth Checks / ${{ github.ref_name }} / ${{ github.sha }}

on:
  push:
    branches:
      - test
      - fix/f01-electron-account-switch-20261015
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f01-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-auth-tests:
    name: Backend refresh and account-switch tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Auth session behavior tests
        run: node --test tests/auth-login-controller.behavior.test.js tests/auth-previous-session-revocation.test.js

  frontend-auth-checks:
    name: Frontend typecheck and auth contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Auth session hardening contract
        run: node --test tests/auth-session-hardening.test.cjs
