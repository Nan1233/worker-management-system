name: KTC Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair machine adjustment fields
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
        run: |
          git show 6d92c5f08169588fa659505ee310844605764d5e:frontend/src/pages/worker/processPageConfig.ts > frontend/src/pages/worker/processPageConfig.ts
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old in s:
                      s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          patch('frontend/src/pages/worker/processPageConfig.ts', [
              ('    minutes: string;\n    okQuantity: string;', '    minutes: string;\n    adjustmentMinutes: string;\n    adjustmentCount: string;\n    okQuantity: string;'),
              ('    minutes: "",\n    okQuantity: "",', '    minutes: "",\n    adjustmentMinutes: "",\n    adjustmentCount: "",\n    okQuantity: "",'),
          ])

          patch('frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx', [
              ('''                                        <div><div className="machine-section-title">Sản lượng</div><div className="machine-quantity-row">\n                                            <label><span>OK</span><input type="number" min="0" inputMode="numeric" value={line.okQuantity} onChange={(event) => updateMachineLine(index, { okQuantity: event.target.value.replace(/\\D/g, "") })} /></label>\n                                            <label><span>NG</span><input type="number" min="0" inputMode="numeric" value={line.ngQuantity} readOnly aria-readonly="true" title="Tự động tính từ chi tiết lỗi NG" /></label>\n                                        </div></div>''', '''                                        <div><div className="machine-section-title">Sản lượng</div><div className="machine-quantity-row">\n                                            <label><span>OK</span><input type="number" min="0" inputMode="numeric" value={line.okQuantity} onChange={(event) => updateMachineLine(index, { okQuantity: event.target.value.replace(/\\D/g, "") })} /></label>\n                                            <label><span>NG</span><input type="number" min="0" inputMode="numeric" value={line.ngQuantity} readOnly aria-readonly="true" title="Tự động tính từ chi tiết lỗi NG" /></label>\n                                        </div></div>\n                                        <div><div className="machine-section-title">Chỉnh máy</div><div className="machine-quantity-row">\n                                            <label><span>Thời gian (phút)</span><input type="number" min="0" inputMode="numeric" placeholder="0" value={line.adjustmentMinutes} onChange={(event) => updateMachineLine(index, { adjustmentMinutes: event.target.value.replace(/\\D/g, "") })} /></label>\n                                            <label><span>Số lần</span><input type="number" min="0" inputMode="numeric" placeholder="0" value={line.adjustmentCount} onChange={(event) => updateMachineLine(index, { adjustmentCount: event.target.value.replace(/\\D/g, "") })} /></label>\n                                        </div></div>'''),
          ])

          patch('frontend/src/pages/worker/processReportSubmission.ts', [
              ('    machine_time_hours:num(l.hours)+num(l.minutes)/60,\n    ok_quantity:num(l.okQuantity),', '    machine_time_hours:num(l.hours)+num(l.minutes)/60,\n    adjustment_minutes:num(l.adjustmentMinutes),\n    adjustment_count:num(l.adjustmentCount),\n    ok_quantity:num(l.okQuantity),'),
          ])

          patch('frontend/src/pages/worker/WorkerReportEdit.tsx', [
              ('machineCode: String(line.machine_code || ""), productCode: String(line.product_code || ""), hours: hm.hours, minutes: hm.minutes, okQuantity:', 'machineCode: String(line.machine_code || ""), productCode: String(line.product_code || ""), hours: hm.hours, minutes: hm.minutes, adjustmentMinutes: String(line.adjustment_minutes ?? ""), adjustmentCount: String(line.adjustment_count ?? ""), okQuantity:'),
          ])

          patch('frontend/src/pages/worker/ProductionDetail.tsx', [
              ('<div><span>Thời gian máy</span><strong>{number(line.machine_time_hours)} giờ</strong></div>\n                          <div><span>OK</span><strong>{quantity(line.ok_quantity)}</strong></div>', '<div><span>Thời gian máy</span><strong>{number(line.machine_time_hours)} giờ</strong></div>\n                          <div><span>Chỉnh máy</span><strong>{number(line.adjustment_minutes)} phút · {quantity(line.adjustment_count)} lần</strong></div>\n                          <div><span>OK</span><strong>{quantity(line.ok_quantity)}</strong></div>'),
          ])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/worker/processPageConfig.ts frontend/src/pages/worker/components/ProcessBasicInfoSection.tsx frontend/src/pages/worker/processReportSubmission.ts frontend/src/pages/worker/WorkerReportEdit.tsx frontend/src/pages/worker/ProductionDetail.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'fix(worker): add per-machine adjustment fields [skip ci]'
            git push
          fi

      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Cloudflare + master-data contracts
        run: node --test tests/cloudflare-production-contract.test.cjs tests/2801-lt-long-selection.contract.test.cjs

      - name: Report regression contracts
        run: node --test tests/regression-report-issues.contract.test.cjs backend/tests/product-suggestion-scope.test.js

      - name: 2801-LT Excel export regression
        run: node --test tests/2801-lt-excel-export.contract.test.cjs

      - name: Critical E2E source gate
        run: node --check scripts/zero-cost/critical-e2e.cjs

      - name: Cloudflare smoke source gate
        run: node --check scripts/cloudflareProductionSmoke.cjs
