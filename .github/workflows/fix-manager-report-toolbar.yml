name: Fix manager report toolbar

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ManagerReportGrid
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('frontend/src/pages/manager/ManagerReportGrid.tsx')
          s = p.read_text(encoding='utf-8')

          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit('Missing expected text: ' + old[:180])
              s = s.replace(old, new, 1)

          rep('import { getApprovedReports, getReportById, updateReport } from "../../services/productionService";',
              'import { deleteReport, getApprovedReports, getReportById, invalidateManagerReportCaches, updateReport } from "../../services/productionService";')

          rep('[drafts,setDrafts]=useState<Record<number,ProductionReport>>({}),[editing,setEditing]=useState<number|null>(null),[saving,setSaving]=useState(false),',
              '[drafts,setDrafts]=useState<Record<number,ProductionReport>>({}),[editing,setEditing]=useState<number|null>(null),[selectedId,setSelectedId]=useState<number|null>(null),[dirty,setDirty]=useState(false),[unsavedPrompt,setUnsavedPrompt]=useState(false),[pendingAction,setPendingAction]=useState<(() => void)|null>(null),[saving,setSaving]=useState(false),')

          rep('useEffect(()=>{void load()},[process,from,to,search,page]);useEffect(()=>{setPage(1);setEditing(null);setDrafts({});setProcessId(process.processId)},[process,from,to,search]);',
              'useEffect(()=>{void load()},[process,from,to,search,page]);useEffect(()=>{setPage(1);if(!dirty){setEditing(null);setSelectedId(null);setDrafts({});}setProcessId(process.processId)},[process,from,to,search]);useEffect(()=>{const before=(e:BeforeUnloadEvent)=>{if(!dirty)return;e.preventDefault();e.returnValue=""};const click=(e:MouseEvent)=>{if(!dirty||saving)return;const t=e.target as HTMLElement|null;const a=t?.closest("a[href]") as HTMLAnchorElement|null;if(!a||a.target==="_blank"||a.hasAttribute("download"))return;if(new URL(a.href,window.location.href).origin!==window.location.origin)return;e.preventDefault();e.stopPropagation();setPendingAction(null);setUnsavedPrompt(true)};window.addEventListener("beforeunload",before);document.addEventListener("click",click,true);return()=>{window.removeEventListener("beforeunload",before);document.removeEventListener("click",click,true)}},[dirty,saving]);')

          pattern=r'const edit=\(r:ProductionReport\)=>\{.*?\nconst save=async\(r:ProductionReport\)=>'
          repl='const selectRow=(r:ProductionReport)=>{if(!editing)setSelectedId(Number(r.id))};const edit=(r:ProductionReport)=>{const id=Number(r.id);setSelectedId(id);setDrafts(p=>({...p,[id]:{...r,deductions:[...(r.deductions||[])],defects:[...(r.defects||[])]}}));setEditing(id);setDirty(false)};const field=(id:number,k:keyof ProductionReport,v:string|number)=>{setDirty(true);setDrafts(p=>({...p,[id]:{...p[id],[k]:v}}))};\nconst save=async(r:ProductionReport)=>'
          s2=re.sub(pattern,repl,s,count=1,flags=re.S)
          if s2==s: raise SystemExit('Could not replace edit/field block')
          s=s2

          rep('showToast("Đã cập nhật báo cáo","success");setEditing(null);setDrafts(p=>{const x={...p};delete x[id];return x});await load()',
              'showToast("Đã cập nhật báo cáo","success");setEditing(null);setSelectedId(null);setDirty(false);setDrafts(p=>{const x={...p};delete x[id];return x});invalidateManagerReportCaches();await load()')

          pattern=r'const cancel=\(id:number\)=>\{.*?\};const input='
          repl='const cancel=(id:number)=>{setEditing(null);setSelectedId(null);setDirty(false);setDrafts(p=>{const x={...p};delete x[id];return x})};const requestLeave=(action:()=>void)=>{if(!dirty||saving){action();return}setPendingAction(()=>action);setUnsavedPrompt(true)};const toolbarEdit=()=>{if(selectedId==null){showToast("Hãy chọn một dòng trước khi bấm Sửa");return}const r=rows.find(x=>Number(x.id)===selectedId);if(r)edit(r)};const toolbarCancel=()=>{if(editing!=null)cancel(editing)};const toolbarSave=async()=>{if(editing==null){showToast("Chưa có dòng đang sửa");return}const r=rows.find(x=>Number(x.id)===editing);if(r)await save(r)};const toolbarDelete=async()=>{if(selectedId==null){showToast("Hãy chọn một dòng trước khi Xóa");return}if(!window.confirm("Xóa báo cáo đã chọn?"))return;try{setSaving(true);await deleteReport(selectedId,"Quản lý xóa báo cáo đã duyệt");setEditing(null);setSelectedId(null);setDrafts(p=>{const x={...p};delete x[selectedId!];return x});setDirty(false);invalidateManagerReportCaches();showToast("Đã xóa báo cáo","success");await load()}catch(e){showToast(axios.isAxiosError(e)?e.response?.data?.message||"Không thể xóa báo cáo":"Không thể xóa báo cáo")}finally{setSaving(false)}};const toolbarAdd=()=>{showToast("Thêm báo cáo mới cần gắn với công nhân cụ thể. Chức năng tạo mới sẽ dùng màn hình Chờ duyệt để không tạo sai công nhân.")};const resolveUnsaved=async(saveFirst:boolean)=>{if(saveFirst&&editing!=null){const r=rows.find(x=>Number(x.id)===editing);if(r){await save(r)}}else{setDirty(false);if(editing!=null)cancel(editing)}const a=pendingAction;setPendingAction(null);setUnsavedPrompt(false);if(a)a()};const input='
          s2=re.sub(pattern,repl,s,count=1,flags=re.S)
          if s2==s: raise SystemExit('Could not replace cancel block')
          s=s2

          rep('<header className="manager-excel-head"><div><h1>Quản lý báo cáo</h1><p>Chỉ báo cáo đã duyệt · từng công đoạn · sửa trực tiếp như Excel, dùng Tab để chuyển ô.</p></div><button type="button" onClick={()=>void load()} disabled={loading}>↻ Làm mới</button></header>',
              '<header className="manager-excel-head"><div><h1>Quản lý báo cáo</h1><p>Chỉ báo cáo đã duyệt · từng công đoạn · thao tác và chỉnh sửa theo kiểu Excel.</p></div><div className="manager-excel-toolbar"><button type="button" onClick={toolbarAdd} disabled={saving}>＋ Thêm</button><button type="button" onClick={toolbarEdit} disabled={saving||editing!==null}>Sửa</button><button type="button" className="primary" onClick={()=>void toolbarSave()} disabled={saving||editing===null||!dirty}>{saving?"Đang lưu...":"Lưu"}</button><button type="button" onClick={toolbarCancel} disabled={saving||editing===null}>Hủy</button><button type="button" className="danger" onClick={()=>void toolbarDelete()} disabled={saving||selectedId===null}>Xóa</button><button type="button" onClick={()=>requestLeave(()=>void load())} disabled={loading||saving}>↻ Làm mới</button></div></header>')

          rep('onClick={()=>{if(!is)edit(original)}}','onClick={()=>selectRow(original)}')
          rep('onClick={e=>setDrafts(p=>({...p,[id]:{...p[id],deductions:putDeduction(p[id],o,n(e.target.value))}}))} onClick={e=>e.stopPropagation()}', 'onChange={e=>{setDirty(true);setDrafts(p=>({...p,[id]:{...p[id],deductions:putDeduction(p[id],o,n(e.target.value))}}))}} onClick={e=>e.stopPropagation()}') if 'onClick={e=>setDrafts(p=>({...p,[id]:{...p[id],deductions:putDeduction' in s else None

          marker='</section></div>;}'
          modal='</section>{unsavedPrompt&&<div className="manager-excel-unsaved-overlay"><div className="manager-excel-unsaved-dialog" role="dialog" aria-modal="true"><h3>Bạn có thay đổi chưa lưu</h3><p>Nếu rời khỏi trang bây giờ, các thay đổi bạn vừa nhập sẽ không còn.</p><div><button type="button" onClick={()=>{setUnsavedPrompt(false);setPendingAction(null)}}>Ở lại</button><button type="button" className="danger" onClick={()=>void resolveUnsaved(false)}>Không lưu</button><button type="button" className="primary" onClick={()=>void resolveUnsaved(true)}>Lưu và tiếp tục</button></div></div></div>}</div>;}'
          if marker not in s: raise SystemExit('Missing render closing marker')
          s=s.replace(marker,modal,1)
          p.write_text(s,encoding='utf-8')
          PY

          cat >> frontend/src/pages/manager/ManagerExcelReports.css <<'CSS'
          .manager-excel-toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.manager-excel-toolbar button{border:1px solid #cbd7e6;background:#fff;color:#172b4d;border-radius:6px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}.manager-excel-toolbar button:disabled{opacity:.5;cursor:not-allowed}.manager-excel-toolbar .primary,.manager-excel-unsaved-dialog .primary{background:#1769d2;color:#fff;border-color:#1769d2}.manager-excel-toolbar .danger,.manager-excel-unsaved-dialog .danger{color:#b42318}.manager-excel-unsaved-overlay{position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.35);display:flex;align-items:center;justify-content:center;padding:20px}.manager-excel-unsaved-dialog{width:min(440px,100%);background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(15,23,42,.2);padding:22px}.manager-excel-unsaved-dialog h3{margin:0 0 8px;color:#172b4d;font-size:17px}.manager-excel-unsaved-dialog p{margin:0 0 18px;color:#5b6b83;font-size:13px;line-height:1.6}.manager-excel-unsaved-dialog>div{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.manager-excel-unsaved-dialog button{border:1px solid #cbd7e6;background:#fff;border-radius:6px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
          CSS

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-manager-report-toolbar.yml
          git add frontend/src/pages/manager/ManagerReportGrid.tsx frontend/src/pages/manager/ManagerExcelReports.css .github/workflows/fix-manager-report-toolbar.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m "fix: add Excel report toolbar and unsaved guard"
          git push
