name: Repair machine fields

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore config from known-good commit
        run: |
          git show 6d92c5f08169588fa659505ee310844605764d5e:frontend/src/pages/worker/processPageConfig.ts > frontend/src/pages/worker/processPageConfig.ts
      - name: Add machine adjustment fields
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/pages/worker/processPageConfig.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    minutes: string;\n    okQuantity: string;', '    minutes: string;\n    adjustmentMinutes: string;\n    adjustmentCount: string;\n    okQuantity: string;', 1)
          s = s.replace('    minutes: "",\n    okQuantity: "",', '    minutes: "",\n    adjustmentMinutes: "",\n    adjustmentCount: "",\n    okQuantity: "",', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'adjustmentMinutes' frontend/src/pages/worker/processPageConfig.ts
          grep -q 'adjustmentCount' frontend/src/pages/worker/processPageConfig.ts
      - name: Commit repaired file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/worker/processPageConfig.ts
          git commit -m 'fix(worker): add per-machine adjustment fields [skip ci]'
          git push
