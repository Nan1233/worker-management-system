name: F04 Worker History Checks
run-name: F04 Worker History Checks / ${{ github.ref_name }} / ${{ github.sha }}

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-history:
    name: Worker history error-state regression + frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Worker history error-state regression tests
        run: node --test tests/production-history-error-state.test.cjs
      - name: Frontend TypeScript typecheck
        run: npm run typecheck
