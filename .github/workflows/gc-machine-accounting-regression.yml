name: GC Machine Accounting Regression

on:
  push:
    branches: [test]
    paths:
      - 'backend/services/machineProductionEventService.js'
      - 'backend/services/bulkCompanyExcelDataService.js'
      - 'backend/services/commonProcessExcelRowValues.js'
      - 'backend/tests/common-process-excel-row-values.test.js'
      - 'backend/tests/gc-event-concurrency.test.js'
      - 'backend/tests/machine-event-optimistic-lock.contract.test.js'
      - '.github/workflows/gc-machine-accounting-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gc-machine-accounting:
    name: GC machine-time accounting regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate accounting and export service syntax
        run: |
          node --check services/machineProductionEventService.js
          node --check services/bulkCompanyExcelDataService.js
          node --check services/commonProcessExcelRowValues.js
          node --check tests/gc-event-concurrency.test.js
          node --check tests/machine-event-optimistic-lock.contract.test.js
          node --check services/giaCongMachineAccounting.js
          node --check services/processExcelExportService.js
          node --check services/monthlyExcelService.js
          node --check services/gcWorkerReportRows.js
          node --check services/commonProcessMonthlyExcelService.js
      - name: Run new GC concurrency and Excel defect regressions
        run: timeout 90s node --test tests/gc-event-concurrency.test.js tests/machine-event-optimistic-lock.contract.test.js tests/common-process-excel-row-values.test.js
      - name: Run existing GC regression suite (known pre-existing failures)
        continue-on-error: true
        run: timeout 90s node --test tests/gc-machine-time-accounting.test.js tests/shared-machine-accounting-flow.test.js tests/gc-worker-report-excel.test.js tests/common-process-gc-excel.test.js
      - name: Full backend regression suite (compare with baseline)
        continue-on-error: true
        run: timeout 180s npm test

  baseline:
    name: Pre-change baseline (historical commit, read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b9e62753c8657c289559a2c7c75a74b2a70d7ed
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Record original full backend test result (expected legacy failures)
        continue-on-error: true
        run: npm test
