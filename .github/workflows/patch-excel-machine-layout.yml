name: One-time manager report title fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'chore: apply manager report title fix')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix report titles
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('frontend/src/pages/manager/Reports.tsx'): [
                  ('<h1>Chờ duyệt báo cáo</h1>', '<h1>Báo cáo chờ duyệt</h1>'),
              ],
              Path('frontend/src/pages/manager/ApprovedReports.tsx'): [
                  ('<h1 style={{ margin: 0, color: "#12385f", fontSize: 26, fontWeight: 800 }}>Đã duyệt báo cáo</h1>', '<h1 style={{ margin: 0, color: "#12385f", fontSize: 26, fontWeight: 800 }}>Báo cáo đã duyệt</h1>'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected title not found in {path}: {old}')
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f'No change made to {path}')
              path.write_text(text, encoding='utf-8', newline='')

          # Remove the old global CSS that hid the real H1. Keep only the
          # subtitle suppression; the canonical H1 must remain visible.
          css = Path('frontend/src/styles/HideManagementPageDescriptions.css')
          css.write_text('''/* KTC Manager: keep report page titles, hide only redundant subtitles. */\n.management-content .pending-reference-page > .pending-page-title > div > p {\n  display: none !important;\n}\n''', encoding='utf-8', newline='')

          # Remove the contradictory rule that hid the approved page title.
          fix = Path('frontend/public/ReportsPendingFix.css')
          text = fix.read_text(encoding='utf-8')
          old_rule = '.pending-reference-page:has(.pending-reference-table th.management-checkbox-column) > .pending-page-title{display:none!important}\n'
          if old_rule in text:
              text = text.replace(old_rule, '', 1)
          fix.write_text(text, encoding='utf-8', newline='')

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/manager/Reports.tsx frontend/src/pages/manager/ApprovedReports.tsx frontend/src/styles/HideManagementPageDescriptions.css frontend/public/ReportsPendingFix.css
          git rm .github/workflows/patch-excel-machine-layout.yml
          git commit -m "chore: apply manager report title fix"
          git push
