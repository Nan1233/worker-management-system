name: Test branch migration safety

on:
  push:
    branches:
      - test
    paths:
      - "backend/**"
      - ".github/workflows/test-migration-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-safety-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-safety:
    name: Verify no automatic migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check backend source
        run: npm run check
      - name: Run migration safety tests
        run: node --test tests/no-automatic-migration.test.js tests/seed-scripts-safety.test.js
      - name: Verify migration inventory without database writes
        run: npm run db:migration-inventory
      - name: Run backend test suite
        run: npm test
