name: Fix report edit prefill

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair edit data restoration
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/pages/worker/WorkerReportEdit.tsx')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'const data = await getReportById(reportId, "pending");\n        if (!data) throw new Error("Không tìm thấy báo cáo.");',
              'const rawData = await getReportById(reportId, "pending");\n        const data = (rawData as any)?.report || (rawData as any)?.data || rawData;\n        if (!data) throw new Error("Không tìm thấy báo cáo.");',
              1,
          )

          s = s.replace(
              'actualHours: actual.hours, actualMinutes: actual.minutes, deductionTime: `${deductionTotal.hours}:${deductionTotal.minutes}`, note: String(data.note || ""),',
              'actualHours: actual.hours, actualMinutes: actual.minutes, deductionTime: `${deductionTotal.hours}:${deductionTotal.minutes}`, adjustmentCount: String((data.extra_data || {}).adjustment_count ?? data.adjustment_count ?? ""), note: String(data.note || data.notes || ""),',
              1,
          )

          s = s.replace(
              'setExtraData(Object.fromEntries(Object.entries(data.extra_data || {}).map(([key, value]) => [key, value == null ? "" : String(value)])));',
              'setExtraData(Object.fromEntries(Object.entries(data.extra_data || {}).map(([key, value]) => [key, value == null ? "" : String(value)])));\n        setForm((current) => ({ ...current, adjustmentCount: String((data.extra_data || {}).adjustment_count ?? data.adjustment_count ?? "") }));',
              1,
          )

          s = s.replace(
              'const source = report.machine_lines?.[index];',
              'const sourceLines = Array.isArray(report.machine_lines) ? report.machine_lines : Array.isArray((report as any).machineLines) ? (report as any).machineLines : [];\n      const source = sourceLines[index];',
              1,
          )

          s = s.replace(
              'const lines = (report.machine_lines || []).map((line) => {',
              'const sourceLines = Array.isArray(report.machine_lines) ? report.machine_lines : Array.isArray((report as any).machineLines) ? (report as any).machineLines : [];\n    const lines = sourceLines.map((line) => {',
              1,
          )

          s = s.replace(
              '(report.deductions || []).forEach((item) => {\n      const key = findDeductionKey(item);\n      if (key) { next[key] = String(Math.round(Number(item.hours || 0) * 60)); selected.push(key); }',
              '(Array.isArray(report.deductions) ? report.deductions : Array.isArray((report as any).deduction_items) ? (report as any).deduction_items : []).forEach((item) => {\n      const key = findDeductionKey(item);\n      const minutes = item.minutes ?? item.deduction_minutes ?? (Number(item.hours || 0) * 60);\n      if (key) { next[key] = String(Math.round(Number(minutes) || 0)); selected.push(key); }',
              1,
          )

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/worker/WorkerReportEdit.tsx
          git commit -m 'fix(worker): restore all report values in edit form [skip ci]'
          git push
      - name: Remove helper workflow
        run: |
          git rm .github/workflows/fix-report-edit-prefill.yml
          git commit -m 'chore: remove report edit prefill helper [skip ci]'
          git push
