name: F02 Worker Home Checks
run-name: F02 Worker Home Checks / ${{ github.ref_name }} / ${{ github.sha }}

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-home-stats:
    name: Worker Home stats + frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Worker Home aggregate regression tests
        run: node --test tests/worker-home-stats.test.cjs
      - name: Frontend TypeScript typecheck
        run: npm run typecheck
