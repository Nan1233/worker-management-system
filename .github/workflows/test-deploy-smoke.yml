name: KTC TEST post-deploy smoke

# Verifies the Cloudflare TEST deployment from a GitHub runner after every push to `test`
# (Workers Builds deploys ktc-be-test / ktc-fe-test from that branch). Read-only apart from normal
# sign-ins. Authenticated checks run only when the optional secrets are configured; otherwise they
# are reported as SKIP, never as PASS. Secrets are passed as env and never printed.
on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ktc-test-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Cloudflare deploy and run smoke checks
        env:
          KTC_SMOKE_WAIT_SECONDS: '900'
          KTC_TEST_SUPERADMIN_USERNAME: superadmin
          KTC_TEST_SUPERADMIN_PASSWORD: ${{ secrets.KTC_TEST_SUPERADMIN_PASSWORD }}
          KTC_TEST_ADMIN_USERNAME: ${{ secrets.KTC_TEST_ADMIN_USERNAME }}
          KTC_TEST_ADMIN_PASSWORD: ${{ secrets.KTC_TEST_ADMIN_PASSWORD }}
          KTC_TEST_WORKER_CODE: ${{ secrets.KTC_TEST_WORKER_CODE }}
        run: node scripts/testDeploySmoke.cjs
