<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
  <title>KTC Production Control</title>
  <style>
    body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f3f6fb;color:#172033;display:grid;place-items:center;min-height:100vh}
    .card{width:min(560px,calc(100% - 40px));padding:36px;border:1px solid #dce5f1;border-radius:24px;background:#fff;box-shadow:0 20px 55px rgba(30,53,84,.12);text-align:center}
    .logo{width:68px;height:68px;margin:auto;display:grid;place-items:center;border-radius:18px;background:#2464c8;color:#fff;font-weight:900}
    h1{margin:20px 0 10px;color:#183a6a}p{color:#64748b;line-height:1.6}
  </style>
</head>
<body><main class="card"><div class="logo">KTC</div><h1>Không thể kết nối hệ thống</h1><p>Hãy kiểm tra kết nối và mở lại ứng dụng.</p></main></body>
</html>
