services:
  - type: web
    name: worker-management-api
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_CONNECTION_LIMIT
        value: "6"
      - key: DB_MAX_IDLE
        value: "3"
      - key: DB_IDLE_TIMEOUT
        value: "60000"
      - key: DB_QUEUE_LIMIT
        value: "100"
      - key: DASHBOARD_CACHE_TTL_MS
        value: "30000"
      - key: INLINE_SYNC_TRIGGER
        value: "false"
      - key: COMPANY_ALLOWED_IPS
        value: "113.160.133.126"

  - type: worker
    name: worker-management-sync
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: npm run worker
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_CONNECTION_LIMIT
        value: "3"
      - key: DB_MAX_IDLE
        value: "2"
      - key: INLINE_SYNC_TRIGGER
        value: "false"
