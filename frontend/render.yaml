services:
  - type: web
    name: ktc-frontend
    runtime: static
    buildCommand: npm ci && npm run check
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://worker-management-system-2-5jqv.onrender.com/api
    headers:
      - path: /KTC-Production-Control.mobileconfig
        name: Content-Type
        value: application/x-apple-aspen-config
      - path: /KTC-Production-Control.mobileconfig
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /downloads/*.apk
        name: Content-Type
        value: application/vnd.android.package-archive
      - path: /downloads/*.apk
        name: Content-Disposition
        value: attachment
      - path: /downloads/*.apk
        name: Cache-Control
        value: public, max-age=3600
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /pwa/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /favicon.svg
        name: Cache-Control
        value: public, max-age=2592000
      - path: /icons.svg
        name: Cache-Control
        value: public, max-age=2592000
      - path: /manifest.webmanifest
        name: Cache-Control
        value: public, max-age=86400
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
