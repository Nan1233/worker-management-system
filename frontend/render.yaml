services:
  - type: web
    name: ktc-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /pwa/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /favicon.svg
        name: Cache-Control
        value: public, max-age=2592000
      - path: /icons.svg
        name: Cache-Control
        value: public, max-age=2592000
      - path: /manifest.webmanifest
        name: Cache-Control
        value: public, max-age=86400
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
